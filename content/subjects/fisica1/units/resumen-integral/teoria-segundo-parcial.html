<script>
/* ================= 4a) Contenido · Rotación y equilibrio (C1–C5) ================= */
(function(){
  'use strict';
  const K=window.Kit,F=window.FIG,R=String.raw;
  const {M,m,chain,key,keys,sym,simple,idea,warn,err,ok,two,ul,ol,deep,example,step,table,fig,cards,lab,field,select,fields,slider,out}=K;
  const T=window.TOPICS=window.TOPICS||[];

  /* ---------------- C1 ---------------- */
  T.push({id:'C1',group:'rot',title:'Momento angular y choques',short:'Bala contra varilla, discos que se acoplan, choques con pivote.',
  lead:'El momento angular es “la cantidad de giro” de algo respecto de un punto. Lo cambia el torque externo; si el torque externo es cero, se conserva. Esa es la llave de todos los choques con pivote.',
  sections:[
  {id:'idea',label:'La idea',html:`
<p>Una partícula que se mueve en línea recta también puede tener momento angular respecto de un punto O. ${simple('No hace falta que gire: alcanza con que su recta de movimiento no pase por O')}</p>
${fig(F.arm,'Lo que importa es el brazo d: la distancia perpendicular desde O hasta la recta por donde va la partícula.')}
${sym([[R`\vec L`,'momento angular respecto de O','kg·m²/s'],[R`\vec r`,'posición desde O hasta la partícula','m'],[R`\vec p=m\vec v`,'cantidad de movimiento','kg·m/s'],['d','brazo: distancia perpendicular de O a la recta de movimiento','m'],[R`\theta`,'ángulo entre r y p',''],[R`I\,,\ \omega`,'momento de inercia y velocidad angular (cuerpo rígido)','kg·m² · rad/s']])}
${key(R`\vec L=\vec r\times\vec p`,'Definición')}
<p>El módulo sale del producto vectorial. Como ${m(R`r\sin\theta`)} es justamente el brazo d, queda la forma que más se usa en los ejercicios:</p>
${chain([R`|\vec L|=r\,p\,\sin\theta`,'módulo del producto vectorial'],[R`r\sin\theta=d`,'la proyección perpendicular es el brazo'],[R`|\vec L|=d\,m\,v`,'forma práctica para partículas'])}
<p>Para un cuerpo rígido que gira alrededor de un eje fijo, todas sus partículas suman y aparece el momento de inercia:</p>
${key(R`L=I\,\omega`,'Cuerpo rígido con eje fijo')}
${idea('Signo del giro',`<p>Elegí un sentido positivo (por ejemplo antihorario) <b>antes</b> de escribir nada y respetalo en todos los términos. Un objeto que pasa “del otro lado” de O aporta con el signo contrario.</p>`)}
`},
  {id:'torque',label:'Torque y conservación',html:`
<p>El torque es a la rotación lo que la fuerza es a la traslación: es <b>la causa</b> que cambia el momento angular.</p>
${chain([R`\vec\tau=\vec r\times\vec F`,'definición'],[R`|\vec\tau|=rF\sin\varphi=d\,F`,'brazo por fuerza'],[R`\frac{d\vec L}{dt}=\vec\tau_{ext}`,'“Newton” para la rotación'])}
<p>De la última ecuación sale la ley que se usa en los choques:</p>
${key(R`\vec\tau_{ext}=0\ \Rightarrow\ \vec L=\text{cte.}\qquad L_i=L_f`,'Conservación del momento angular')}
${two(idea('Fuerzas internas no cuentan',`<p>En un choque, la bala y la varilla se empujan con fuerzas enormes, pero son internas al sistema: se cancelan de a pares y no cambian el L total.</p>`),
     idea('Truco del pivote',`<p>El pivote hace una fuerza externa desconocida. Si tomás momentos <b>respecto del pivote</b>, esa fuerza tiene brazo 0 y no hace torque. ${simple('Por eso L se conserva respecto del pivote, aunque p lineal no')}</p>`))}
<h3>Impulso angular</h3>
<p>Si sí hay torque externo, el cambio de L es el impulso angular:</p>
${chain([R`\vec J=\int\vec\tau\,dt`,'impulso angular'],[R`\vec L_f-\vec L_i=\vec J=\vec\tau_m\,\Delta t`,'con el torque medio'])}
${deep('L de un sistema y el centro de masa',`
<p>Para muchas partículas se suman los momentos angulares de cada una:</p>
${M(R`\vec L=\sum_i\vec r_i\times\vec p_i`)}
<p>Se puede separar en dos partes: el giro “alrededor del propio centro de masa” (${m(R`\vec L\,'`)}) más el momento angular del CM moviéndose como si fuera una partícula con toda la masa:</p>
${M(R`\vec L=\vec L\,'+\vec r_{CM}\times\vec P`,'giro propio + movimiento del CM')}
<p>Esto explica, por ejemplo, por qué una rueda que rueda tiene L aunque su centro vaya en línea recta.</p>
${M(R`L_x=y\,p_z-z\,p_y\qquad L_y=z\,p_x-x\,p_z\qquad L_z=x\,p_y-y\,p_x`,'componentes, si te dan vectores')}`)}
`},
  {id:'choques',label:'Choques con pivote',html:`
${fig(F.bullet,'Bala que se incrusta en una varilla colgada. Antes: sólo la bala tiene L. Después: gira todo junto.')}
${ol(['Elegí el pivote como punto de referencia y un sentido positivo.','Escribí L inicial: cada partícula aporta '+m('d\\,m\\,v')+'; cada cuerpo que ya gira aporta '+m('I\\omega')+'.','Escribí L final con el momento de inercia del conjunto. Si algo queda pegado a distancia d, sumá '+m('m\\,d^2')+'.','Igualá '+m('L_i=L_f')+' y despejá.','Si después hay una subida (la varilla se eleva), eso ya es otra etapa: ahí sí usás energía.'])}
${key(R`I_{total}=I_{cuerpo}+m\,d^2`,'Masa que queda pegada')}
${keys([[R`m\,v_i\,d=I\,\omega+m\,v_f\,d`,'Si la bala atraviesa y sale'],[R`I_1\omega_1+I_2\omega_2=(I_1+I_2)\,\omega`,'Dos discos que se acoplan']])}
${warn('Energía en el choque',`<p>Si el choque es inelástico (se pega, se clava, se acopla) <b>no</b> se conserva la energía cinética: parte se va en deformación y calor. Sólo vale ${m('L_i=L_f')}.</p>`)}
${example('Bala que se clava en una varilla',
  `Una varilla de ${m('M=2\\ \\mathrm{kg}')} y ${m('L=1\\ \\mathrm{m}')} cuelga de un pivote en su extremo superior. Una bala de ${m('m=20\\ \\mathrm g')} viaja horizontal a ${m('300\\ \\mathrm{m/s}')}, impacta en el extremo inferior y queda incrustada. ¿Con qué ω arranca a girar? ¿Qué fracción de energía se pierde?`,
  step('1 · Momento de inercia final respecto del pivote',chain([R`I=\tfrac13ML^2+m\,L^2`,'varilla por extremo + bala pegada'],[R`I=\tfrac13(2)(1)^2+0{,}02\,(1)^2=0{,}687\ \mathrm{kg\,m^2}`]))+
  step('2 · Conservación de L respecto del pivote',chain([R`L_i=m\,v\,d=0{,}02\cdot300\cdot1=6\ \mathrm{kg\,m^2/s}`,'sólo la bala tiene L'],[R`L_f=I\,\omega`],[R`\omega=\frac{6}{0{,}687}\approx8{,}74\ \mathrm{rad/s}`,'despejo']))+
  step('3 · Energía antes y después',chain([R`K_i=\tfrac12(0{,}02)(300)^2=900\ \mathrm J`],[R`K_f=\tfrac12(0{,}687)(8{,}74)^2\approx26{,}2\ \mathrm J`],[R`\frac{K_i-K_f}{K_i}\approx0{,}97`,'se pierde ≈ 97 %'])),
  `${m('\\omega\\approx8{,}74\\ \\mathrm{rad/s}')} y se disipa cerca del 97 % de la energía: por eso no se puede usar energía en el choque.`)}
${example('Patinadora que cierra los brazos',
  `Una patinadora gira a 1 vuelta por segundo con ${m('I_1=3\\ \\mathrm{kg\\,m^2}')}. Cierra los brazos y su momento de inercia baja a ${m('I_2=1{,}2\\ \\mathrm{kg\\,m^2}')}. ¿A qué velocidad gira ahora?`,
  chain([R`I_1\omega_1=I_2\omega_2`,'no hay torque externo sobre el eje'],[R`\omega_2=\frac{I_1}{I_2}\,\omega_1=\frac{3}{1{,}2}\cdot1=2{,}5\ \text{vueltas/s}`]),
  `Gira 2,5 veces más rápido. ${simple('Concentrar la masa cerca del eje baja I y, para conservar L, sube ω')}`)}
${lab('bullet','Bala contra varilla con pivote','Cambiá los datos y mirá cuánta energía se pierde. La varilla cuelga de un extremo; la bala impacta a una distancia d del pivote y queda incrustada.',fields(field('M','Masa varilla M (kg)',2),field('L','Largo L (m)',1),field('m','Masa bala m (g)',20),field('v','Velocidad v (m/s)',300),field('d','Distancia d (m)',1))+out)}
`},
  {id:'errores',label:'Errores y repaso',html:`
${err('No conserves p lineal si hay pivote',`<p>El pivote hace fuerza externa durante el choque. Lo que se conserva es L respecto del pivote.</p>`)}
${err('No olvides la masa que queda pegada',`<p>El I final es el de la varilla <b>más</b> ${m('m d^2')} de lo que se incrustó.</p>`)}
${err('No uses energía durante el choque inelástico',`<p>Energía sólo en las etapas sin choque (por ejemplo, la subida posterior).</p>`)}
${cards([['Concepto','¿Qué tiene que pasar para que se conserve L?','Que el torque externo neto respecto del punto elegido sea cero (o despreciable durante el choque).'],
['Fórmula','Momento angular de una partícula que pasa a distancia d de O','L = d·m·v, con d la distancia perpendicular de O a la recta de movimiento.'],
['Truco','¿Respecto de qué punto conviene tomar momentos en un choque con pivote?','Respecto del pivote: su reacción tiene brazo cero y no hace torque.'],
['Trampa','Choque inelástico: ¿se conserva la energía cinética?','No. Se conserva L; la energía cinética disminuye.'],
['Fórmula','Bala que atraviesa y sale','m·vᵢ·d = I·ω + m·v_f·d (con signos según el sentido).']])}
`}]});

  /* ---------------- C2 ---------------- */
  T.push({id:'C2',group:'rot',title:'Cuerpo rígido y rotación',short:'Στ = Iα, energía de rotación, poleas con masa.',
  lead:'Un cuerpo rígido que gira se describe con las mismas ideas que una partícula, cambiando cada magnitud lineal por su “versión angular”: x → θ, v → ω, a → α, m → I y F → τ.',
  sections:[
  {id:'cinematica',label:'Cinemática angular',html:`
<p>En un cuerpo rígido las distancias entre sus puntos no cambian. Si gira alrededor de un eje fijo, <b>todos sus puntos barren el mismo ángulo</b> en el mismo tiempo.</p>
${fig(F.rigid,'Todos los puntos comparten ω y α; la velocidad lineal crece con la distancia al eje.')}
${sym([[R`\theta`,'posición angular','rad'],[R`\omega`,'velocidad angular','rad/s'],[R`\alpha`,'aceleración angular','rad/s²'],['r','distancia del punto al eje','m'],['v','velocidad lineal del punto','m/s'],[R`a_t,\ a_c`,'aceleración tangencial y centrípeta','m/s²']])}
${chain([R`\omega=\frac{d\theta}{dt}\qquad\alpha=\frac{d\omega}{dt}`,'definiciones'],[R`v=r\,\omega`,'velocidad del punto'],[R`a_t=r\,\alpha`,'cambia el módulo de v'],[R`a_c=\frac{v^2}{r}=r\,\omega^2`,'cambia la dirección de v'])}
${idea('Una tabla para traducir',table(['Traslación','Rotación','Relación'],[[m('x'),m('\\theta'),m('s=r\\theta')],[m('v'),m('\\omega'),m('v=r\\omega')],[m('a'),m('\\alpha'),m('a_t=r\\alpha')],[m('m'),m('I'),m('I=\\sum m_ir_i^2')],[m('F'),m('\\tau'),m('\\tau=dF')],[m('\\sum F=ma'),m('\\sum\\tau=I\\alpha'),'2.ª ley'],[m('\\tfrac12mv^2'),m('\\tfrac12I\\omega^2'),'energía'],[m('p=mv'),m('L=I\\omega'),'“cantidad de movimiento”']]))}
`},
  {id:'inercia',label:'Momento de inercia',html:`
<p>El momento de inercia es la <b>“masa rotacional”</b>: mide cuánto cuesta cambiar la velocidad angular. ${simple('Cuanto más lejos del eje está la masa, más cuesta hacerlo girar o frenarlo')}</p>
${keys([[R`I=\sum_i m_i\,r_i^2`,'Partículas'],[R`I=\int r^2\,dm`,'Cuerpo continuo']])}
<p>Para integrar se reemplaza ${m('dm')} según la forma del cuerpo:</p>
${chain([R`dm=\lambda\,dx`,'hilo o varilla (λ = masa/longitud)'],[R`dm=\sigma\,dA`,'placa o disco (σ = masa/área)'],[R`dm=\rho\,dV`,'volumen (ρ = masa/volumen)'])}
${warn('I depende del eje',`<p>No existe “el” momento de inercia de un cuerpo: una misma varilla tiene ${m('\\tfrac1{12}ML^2')} si gira por el centro y ${m('\\tfrac13ML^2')} si gira por un extremo. Los valores de tabla y Steiner están en el tema C3.</p>`)}
`},
  {id:'dinamica',label:'Στ = Iα y energía',html:`
${key(R`\sum\tau=I\,\alpha`,'Segunda ley para la rotación')}
<p>Es la versión rotacional de ${m('\\sum F=ma')}: el torque neto respecto del eje produce aceleración angular. ${simple('Mismo torque sobre algo con más I → gira acelerando menos')}</p>
<h3>Trabajo, energía y potencia</h3>
${chain([R`dW=\tau\,d\theta`,'trabajo de un torque'],[R`W=\int_{\theta_i}^{\theta_f}\tau\,d\theta`],[R`W_{total}=\tfrac12I\omega_f^2-\tfrac12I\omega_i^2`,'teorema trabajo–energía'],[R`P=\tau\,\omega`,'potencia (como P = F·v)'])}
${key(R`E_{c,rot}=\tfrac12\,I\,\omega^2`,'Energía cinética de rotación')}
${example('Torque sobre un disco',
  `Un cuerpo con ${m('I=0{,}50\\ \\mathrm{kg\\,m^2}')} recibe un torque neto de ${m('2\\ \\mathrm{N\\,m}')}. ¿Qué aceleración angular tiene?`,
  chain([R`\alpha=\frac{\tau}{I}=\frac{2}{0{,}50}=4\ \mathrm{rad/s^2}`]),`${m('\\alpha=4\\ \\mathrm{rad/s^2}')}`)}
`},
  {id:'polea',label:'Poleas con masa',html:`
${fig(F.pulley,'Si la cuerda no desliza, el borde de la polea y la cuerda tienen la misma aceleración: a = Rα.')}
<div class="box method"><b>Método para poleas</b>${ol(['Un DCL por cuerpo: bloques (fuerzas) y polea (torques).','Bloques: '+m('\\sum F=ma')+'. Polea: '+m('\\sum\\tau=I\\alpha')+'.','Vínculo: '+m('a=R\\alpha')+' si la cuerda no desliza.','Resolvé el sistema.'])}</div>
${keys([[R`(T_2-T_1)\,R=I\,\alpha`,'Polea con inercia entre dos tensiones'],[R`\tau=R\,T`,'Tensión tangente al borde']])}
${err('Tensiones iguales',`<p>Si la polea tiene masa, <b>las tensiones a cada lado son distintas</b>: justamente su diferencia es lo que la hace girar. Sólo son iguales si la polea es ideal (sin masa).</p>`)}
${example('Bloque colgado de una polea con masa',
  `Una polea-disco de ${m('M=2\\ \\mathrm{kg}')} y ${m('R=0{,}1\\ \\mathrm m')} gira sin rozamiento. De una cuerda enrollada cuelga un bloque de ${m('m=1\\ \\mathrm{kg}')}. Hallá a, T y α (g = 9,8 m/s²).`,
  step('1 · Ecuaciones',chain([R`m\,g-T=m\,a`,'bloque (positivo hacia abajo)'],[R`T\,R=I\,\alpha=\tfrac12MR^2\,\alpha`,'polea'],[R`a=R\,\alpha`,'la cuerda no desliza']))+
  step('2 · Combino',chain([R`T=\tfrac12M\,a`,'reemplazo α = a/R en la polea'],[R`m\,g=\left(m+\tfrac12M\right)a`,'sumo con la del bloque'],[R`a=\frac{1\cdot9{,}8}{1+1}=4{,}9\ \mathrm{m/s^2}`]))+
  step('3 · Resto',chain([R`T=\tfrac12(2)(4{,}9)=4{,}9\ \mathrm N`],[R`\alpha=\frac{a}{R}=49\ \mathrm{rad/s^2}`])),
  `${m('a=4{,}9\\ \\mathrm{m/s^2}')}, ${m('T=4{,}9\\ \\mathrm N')}, ${m('\\alpha=49\\ \\mathrm{rad/s^2}')}. ${simple('Con polea sin masa daría a = g: cae libre porque nada lo frena')}`)}
${lab('pulley','Bloque colgando de una polea con masa','Probá agrandar la polea o cambiar su forma: mirá cómo baja la aceleración.',fields(field('m','Bloque m (kg)',1),field('M','Polea M (kg)',2),select('shape','Forma de la polea',[['0.5','Disco macizo (½MR²)'],['1','Aro (MR²)'],['0','Ideal, sin masa']]))+out)}
`},
  {id:'repaso',label:'Errores y repaso',html:`
${err('Mezclar ω y v',`<p>Todos los puntos tienen igual ω, pero ${m('v=r\\omega')} cambia con r.</p>`)}
${err('Olvidar la energía de rotación',`<p>Si algo gira, su energía cinética incluye ${m('\\tfrac12I\\omega^2')}. Una polea con masa “se queda” con parte de la energía.</p>`)}
${cards([['Concepto','¿Qué mide el momento de inercia?','La resistencia a cambiar la velocidad angular. Depende de la masa y de qué tan lejos del eje está.'],
['Fórmula','2.ª ley de Newton para la rotación','Στ = I·α (torques respecto del eje de giro).'],
['Vínculo','Cuerda que no desliza sobre una polea fija','a = R·α'],
['Trampa','¿T₁ = T₂ en una polea con masa?','No. (T₂ − T₁)·R = I·α. Sólo son iguales si la polea es ideal.'],
['Energía','Potencia de un torque','P = τ·ω']])}
`}]});

  /* ---------------- C3 ---------------- */
  T.push({id:'C3',group:'rot',title:'Momentos de inercia y Steiner',short:'Tabla de I y cómo trasladarlo a otro eje paralelo.',
  lead:'Casi nunca vas a integrar en un parcial: vas a usar los momentos de inercia de tabla y, si el eje está corrido, el teorema de Steiner.',
  sections:[
  {id:'tabla',label:'Tabla de momentos',html:`
${table(['Cuerpo','Eje','I'],[
 ['Partícula','a distancia r',m('mr^2')],
 ['Aro / cilindro hueco delgado','por su eje',m('MR^2')],
 ['Disco / cilindro macizo','por su eje',m('\\tfrac12MR^2')],
 ['Varilla','por el centro, perpendicular',m('\\tfrac1{12}ML^2')],
 ['Varilla','por un extremo, perpendicular',m('\\tfrac13ML^2')],
 ['Esfera maciza','por un diámetro',m('\\tfrac25MR^2')],
 ['Esfera hueca (cáscara)','por un diámetro',m('\\tfrac23MR^2')]])}
${idea('Cómo recordarlos',`<p>El coeficiente dice qué tan lejos del eje está la masa “en promedio”. El aro tiene toda la masa en el borde → coeficiente 1. El disco tiene masa también cerca del centro → ½. La esfera maciza concentra más masa cerca del eje → ⅖, menos que la hueca (⅔).</p>`)}
`},
  {id:'steiner',label:'Teorema de Steiner',html:`
${fig(F.steiner,'Steiner pasa de un eje por el CM a otro eje paralelo, separado d.')}
${key(R`I_P=I_{CM}+M\,d^2`,'Ejes paralelos')}
${sym([[R`I_{CM}`,'momento respecto del eje por el centro de masa','kg·m²'],[R`I_P`,'momento respecto del eje paralelo que pasa por P','kg·m²'],['d','distancia entre los dos ejes','m']])}
<p>Comprobación con la varilla: pasamos del centro a un extremo, que está a ${m('d=L/2')}.</p>
${chain([R`I_{ext}=\tfrac1{12}ML^2+M\left(\tfrac L2\right)^2`,'Steiner'],[R`I_{ext}=\tfrac1{12}ML^2+\tfrac{3}{12}ML^2=\tfrac13ML^2`,'coincide con la tabla ✓'])}
${warn('Condiciones',`<p>1) Los ejes tienen que ser <b>paralelos</b>. 2) Uno de los dos <b>tiene que pasar por el CM</b>. ${simple('Para ir de un eje cualquiera a otro, pasá primero por el CM')}</p>`)}
${idea('Consecuencia útil',`<p>Como ${m('Md^2\\ge0')}, el eje por el CM es el de <b>menor</b> momento de inercia entre todos los paralelos.</p>`)}
${example('Varilla con eje corrido',
  `Una varilla de ${m('M=1{,}2\\ \\mathrm{kg}')} y ${m('L=0{,}9\\ \\mathrm m')} gira por un eje perpendicular ubicado a 15 cm de un extremo. Hallá I.`,
  chain([R`d=\tfrac L2-0{,}15=0{,}45-0{,}15=0{,}30\ \mathrm m`,'distancia del eje al centro'],[R`I_{CM}=\tfrac1{12}(1{,}2)(0{,}9)^2=0{,}081\ \mathrm{kg\,m^2}`],[R`I_P=0{,}081+1{,}2\,(0{,}30)^2=0{,}189\ \mathrm{kg\,m^2}`,'Steiner']),
  `${m('I_P=0{,}189\\ \\mathrm{kg\\,m^2}')}`)}
${example('Disco colgado de un punto del borde',
  `¿Cuánto vale I para un disco de masa M y radio R que gira por un eje perpendicular que pasa por su borde?`,
  chain([R`I_P=\tfrac12MR^2+MR^2=\tfrac32MR^2`,'d = R']),`${m('I_P=\\tfrac32MR^2')} ${simple('se usa en el péndulo físico de un disco, tema C8')}`)}
${lab('steiner','Moveé el eje de una varilla','Arrastrá el control para correr el eje desde el centro hasta el extremo. Mirá cómo crece I con d².',slider('x','Eje a',0,100,1,50)+`<svg class="stage" viewBox="0 0 480 140" data-stage></svg>`+out)}
`},
  {id:'parciales',label:'Uso en parciales',html:`
${ul(['<b>Varilla con bala o bloque pegado:</b> I de la varilla respecto del pivote + '+m('m d^2')+' de lo que se pega.','<b>Péndulo físico:</b> siempre necesitás '+m('I_P')+' respecto del pivote, no '+m('I_{CM}')+'.','<b>Discos, cilindros y poleas:</b> casi siempre '+m('\\tfrac12MR^2')+', salvo que diga hueco o aro.','<b>Cuerpos compuestos:</b> el I total es la suma de los I de cada parte, todos respecto del mismo eje.'])}
${err('Errores típicos',ul(['Usar '+m('I_{CM}')+' cuando el eje está en un extremo o en un agujero.','Olvidar el '+m('md^2')+' de una masa puntual pegada.','Confundir esfera maciza (⅖) con hueca (⅔).','Aplicar Steiner entre dos ejes que no pasan por el CM.']))}
${cards([['Fórmula','Teorema de Steiner','I_P = I_CM + M·d², con ejes paralelos y uno por el CM.'],
['Tabla','Varilla por el centro / por un extremo','1/12·ML²  /  1/3·ML²'],
['Tabla','Disco macizo y aro','½·MR²  y  MR²'],
['Tabla','Esfera maciza y hueca','2/5·MR²  y  2/3·MR²'],
['Concepto','¿Qué eje paralelo da el menor I?','El que pasa por el centro de masa.']])}
`}]});

  /* ---------------- C4 ---------------- */
  T.push({id:'C4',group:'rot',title:'Rodadura, poleas y carretes',short:'Rodar sin deslizar: traslación + rotación al mismo tiempo.',
  lead:'Rodar sin deslizar es trasladarse y girar a la vez, con una condición que los ata: el punto que toca el piso está quieto en ese instante.',
  sections:[
  {id:'condicion',label:'La condición de rodadura',html:`
${fig(F.roll,'Contacto quieto, centro a v, punto de arriba a 2v.')}
<p>Cada punto de la rueda suma la velocidad del centro (traslación) más ${m('\\omega r')} (rotación). En el punto de contacto esas dos se restan y dan cero; arriba se suman y dan el doble.</p>
${chain([R`v_{CM}=R\,\omega`,'condición de rodadura'],[R`a_{CM}=R\,\alpha`,'derivando'],[R`v_{arriba}=2\,v_{CM}`,'el punto superior'])}
${idea('¿Y el rozamiento?',`<p>En rodadura pura el rozamiento es <b>estático</b>: el punto de contacto no resbala. Por eso puede hacer torque pero <b>no disipa energía</b>. ${simple('Se puede usar conservación de la energía aunque haya rozamiento')}</p>`)}
`},
  {id:'energia',label:'Energía y aceleración',html:`
${key(R`E_c=\tfrac12M\,v_{CM}^2+\tfrac12I_{CM}\,\omega^2`,'Traslación + rotación')}
<p>Otra forma: pensar que, en cada instante, la rueda gira alrededor del punto de contacto A.</p>
${chain([R`I_A=I_{CM}+MR^2`,'Steiner al punto de contacto'],[R`E_c=\tfrac12\left(I_{CM}+MR^2\right)\omega^2=\tfrac12I_A\,\omega^2`,'da lo mismo'])}
<h3>Bajando por un plano inclinado</h3>
${fig(F.incline,'El rozamiento estático apunta hacia arriba del plano y hace girar al cuerpo.')}
<p>Escribamos ${m('I_{CM}=c\\,MR^2')} (c = ½ disco, 1 aro, ⅖ esfera…). Con Newton + torque + rodadura:</p>
${chain([R`Mg\sin\theta-f_e=M\,a_{CM}`,'traslación a lo largo del plano'],[R`f_e\,R=I_{CM}\,\alpha=c\,MR^2\,\frac{a_{CM}}{R}`,'rotación respecto del CM'],[R`f_e=c\,M\,a_{CM}`,'simplifico'],[R`a_{CM}=\frac{g\sin\theta}{1+c}`,'reemplazo en la primera'])}
<p>Por energía, bajando una altura h desde el reposo:</p>
${chain([R`Mgh=\tfrac12Mv^2+\tfrac12\,cMR^2\left(\tfrac vR\right)^2`],[R`v=\sqrt{\frac{2gh}{1+c}}`,'no depende de M ni de R'])}
${idea('Conclusión que toman en los parciales',`<p>Gana la carrera el que tiene <b>menor c</b>: esfera maciza (0,4) &gt; disco (0,5) &gt; esfera hueca (0,67) &gt; aro (1). Un bloque sin rozamiento (c = 0) les gana a todos. ${simple('Todo lo que se va en hacer girar no se va en avanzar')}</p>`)}
${lab('race','Carrera por el plano inclinado','Todos parten juntos desde la misma altura. Cambiá el ángulo y largá.',slider('ang','Ángulo',5,60,1,30)+`<svg class="stage" viewBox="0 0 480 250" data-stage></svg><div class="btnRow"><button type="button" class="btn primary" data-go>▶ Largar</button><button type="button" class="btn" data-reset>Reiniciar</button></div>`+out)}
${example('Disco que baja rodando',
  `Un disco de 2 kg baja rodando sin deslizar por un plano de 30°, desde el reposo y una altura de 2 m. Hallá ${m('a_{CM}')}, la rapidez abajo y el rozamiento.`,
  chain([R`a_{CM}=\frac{9{,}8\cdot\sin30^\circ}{1+\tfrac12}=3{,}27\ \mathrm{m/s^2}`,'c = ½'],[R`v=\sqrt{\frac{2\cdot9{,}8\cdot2}{1{,}5}}=5{,}11\ \mathrm{m/s}`],[R`f_e=\tfrac12\,M\,a_{CM}=\tfrac12\cdot2\cdot3{,}27=3{,}27\ \mathrm N`,'estático, no disipa']),
  `${m('a\\approx3{,}27\\ \\mathrm{m/s^2}')}, ${m('v\\approx5{,}11\\ \\mathrm{m/s}')}, ${m('f_e\\approx3{,}27\\ \\mathrm N')} (hacia arriba del plano).`)}
`},
  {id:'cuerdas',label:'Cuerdas, poleas y carretes',html:`
<p>La clave es saber <b>qué punto del cuerpo</b> está unido a la cuerda y cuánto se mueve ese punto.</p>
${table(['Situación','Relación de la cuerda'],[
 ['Polea o tambor fijo, la cuerda no desliza',m('a=R\\alpha')],
 ['Cilindro que rueda y la cuerda sale por arriba',m('a_{cuerda}=2R\\alpha')+' (el punto de arriba va al doble)'],
 ['Carrete: cuerda en el radio chico r',m('a_{cuerda}=\\alpha(R\\pm r)')],
 ['Polea con masa entre dos tramos',m('(T_2-T_1)R=I\\alpha')]])}
${fig(F.spool,'Carrete: la cuerda sale del radio chico. Medí todo desde el punto de contacto con el piso.')}
${idea('Por qué R ± r',`<p>En rodadura todo gira alrededor del punto de contacto. El punto de donde sale la cuerda está a ${m('R+r')} del piso si sale por arriba del eje, o a ${m('R-r')} si sale por abajo. Su aceleración es esa distancia por α.</p>`)}
<div class="box method"><b>Método para rodadura con cuerdas</b>${ol(['Dibujar fuerzas: peso, normal, tensión y rozamiento.','Plantear '+m('\\sum F=Ma_{CM}')+'.','Plantear '+m('\\sum\\tau_{CM}=I_{CM}\\alpha')+'.','Agregar rodadura: '+m('a_{CM}=R\\alpha')+'.','Agregar la relación correcta de la cuerda.'])}</div>
`},
  {id:'repaso',label:'Errores y repaso',html:`
${err('Usar sólo ½Mv²',`<p>Si rueda, la energía tiene dos términos: traslación y rotación.</p>`)}
${err('Rozamiento “que frena”',`<p>En rodadura pura el rozamiento es estático y no disipa: no restes energía por él.</p>`)}
${err('a = Rα para todo',`<p>Si la cuerda sale por arriba de un cilindro que rueda, su punto va al doble: ${m('a=2R\\alpha')}.</p>`)}
${cards([['Condición','Rodar sin deslizar','v_CM = R·ω y a_CM = R·α; el punto de contacto está instantáneamente quieto.'],
['Energía','Energía cinética de algo que rueda','½·M·v_CM² + ½·I_CM·ω²'],
['Resultado','Aceleración al bajar rodando un plano','a = g·sen θ / (1 + c), con I_CM = c·M·R²'],
['Concepto','¿Quién llega primero: aro o disco?','El disco: tiene menor c (½ < 1).'],
['Trampa','¿El rozamiento estático disipa energía en rodadura pura?','No: el punto de contacto no resbala.']])}
`}]});

  /* ---------------- C5 ---------------- */
  T.push({id:'C5',group:'rot',title:'Equilibrio estático',short:'Vigas, escaleras y barras: ΣF = 0 y Στ = 0.',
  lead:'Un cuerpo está en equilibrio cuando no acelera ni traslacional ni angularmente. Para un cuerpo extenso no alcanza con que las fuerzas se cancelen: también tienen que cancelarse los torques.',
  sections:[
  {id:'condiciones',label:'Las dos condiciones',html:`
${keys([[R`\sum F_x=0\qquad\sum F_y=0`,'No traslada'],[R`\sum\tau=0`,'No rota (respecto de cualquier punto)']])}
${sym([[R`\tau=d\,F`,'torque: brazo perpendicular por fuerza','N·m'],[R`f_e\le\mu_eN`,'rozamiento estático: se adapta hasta un máximo','N'],[R`f_e=\mu_eN`,'sólo “a punto de deslizar”','N'],[R`f_d=\mu_dN`,'rozamiento dinámico (si ya desliza)','N']])}
${idea('El truco más importante',`<p>Si el cuerpo está en equilibrio, ${m('\\sum\\tau=0')} vale <b>respecto de cualquier punto</b>. Elegí el punto por donde pasan más incógnitas: esas fuerzas tienen brazo cero y desaparecen de la ecuación. ${simple('Una ecuación, una incógnita')}</p>`)}
${idea('El peso va en el centro de masa',`<p>Una viga uniforme se reemplaza por su peso aplicado en el medio.</p>`)}
`},
  {id:'viga',label:'Vigas y barras',html:`
${fig(F.beam,'Viga uniforme sobre dos apoyos, con una carga P.')}
${example('Viga con una carga',
  `Una viga uniforme de 4 m pesa 200 N y está apoyada en sus extremos A y B. Se apoya una carga de 600 N a 1 m de A. Hallá las reacciones.`,
  step('1 · Torques respecto de A (elimina N_A)',chain([R`N_B\cdot4-200\cdot2-600\cdot1=0`,'antihorario +'],[R`N_B=\frac{400+600}{4}=250\ \mathrm N`]))+
  step('2 · Fuerzas verticales',chain([R`N_A+N_B-200-600=0`],[R`N_A=800-250=550\ \mathrm N`])),
  `${m('N_A=550\\ \\mathrm N')} y ${m('N_B=250\\ \\mathrm N')}. ${simple('El apoyo más cercano a la carga soporta más')}`)}
${lab('beam','Viga sobre dos apoyos','Mové la carga y mirá cómo se reparte entre los apoyos.',fields(field('L','Largo L (m)',4),field('W','Peso de la viga W (N)',200),field('P','Carga P (N)',600))+slider('x','Posición de P desde A',0,100,1,25)+`<svg class="stage" viewBox="0 0 480 170" data-stage></svg>`+out)}
`},
  {id:'escalera',label:'Escaleras y rozamiento',html:`
${fig(F.ladder,'Pared lisa (sólo normal) y piso con rozamiento.')}
<p>El planteo típico: ¿qué rozamiento mínimo hace falta para que no deslice? Se toman momentos respecto del pie de la escalera, porque ahí actúan N y ${m('f_e')}.</p>
${example('Escalera a punto de deslizar',
  `Una escalera uniforme de peso W = 200 N forma 60° con el piso y se apoya en una pared lisa. ¿Qué ${m('\\mu_e')} mínimo necesita el piso?`,
  chain([R`N=W=200\ \mathrm N`,'ΣF_y = 0'],[R`f_e=N_p`,'ΣF_x = 0'],[R`N_p\,L\sin60^\circ=W\,\tfrac L2\cos60^\circ`,'Στ respecto del pie'],[R`N_p=\frac{W}{2\tan60^\circ}=57{,}7\ \mathrm N`],[R`\mu_{e,min}=\frac{f_e}{N}=\frac{57{,}7}{200}\approx0{,}29`,'a punto de deslizar: f_e = μ_e N']),
  `${m('\\mu_e\\ge0{,}29')}. ${simple('Más inclinada (ángulo chico) → hace falta más rozamiento')}`)}
${warn('¿Igual o menor?',`<p>Usá ${m('f_e=\\mu_eN')} sólo si dice “a punto de deslizar”, “mínimo”, “máximo” o “justo”. Si no, el rozamiento es una incógnita más con ${m('f_e\\le\\mu_eN')}.</p>`)}
`},
  {id:'repaso',label:'Errores y repaso',html:`
${err('Sólo sumar fuerzas',`<p>Con ${m('\\sum F=0')} solo, una barra todavía puede girar. Siempre agregá ${m('\\sum\\tau=0')}.</p>`)}
${err('Brazo mal medido',`<p>El brazo es la distancia <b>perpendicular</b> a la recta de acción de la fuerza, no la distancia al punto de aplicación (salvo que sean perpendiculares).</p>`)}
${cards([['Condiciones','¿Qué pide el equilibrio de un cuerpo extenso?','ΣFx = 0, ΣFy = 0 y Στ = 0.'],
['Truco','¿Dónde tomar momentos?','En el punto por donde pasan más fuerzas desconocidas (pivote, apoyo, pie de la escalera).'],
['Rozamiento','¿Cuándo f_e = μ_e·N?','Sólo en el límite: “a punto de deslizar”.'],
['Concepto','Viga uniforme: ¿dónde va su peso?','En su centro (el centro de masa).']])}
`}]});
})();
</script>
<script>
/* ================= 4b) Contenido · Oscilaciones (C6–C8) ================= */
(function(){
  'use strict';
  const K=window.Kit,F=window.FIG,R=String.raw;
  const {M,m,chain,key,keys,sym,simple,idea,warn,err,ok,two,ul,ol,deep,example,step,table,fig,cards,lab,field,select,fields,slider,out}=K;
  const T=window.TOPICS;

  /* ---------------- C6 ---------------- */
  T.push({id:'C6',group:'osc',title:'Oscilaciones y resortes (MAS)',short:'x(t) = A cos(Ωt + φ), período, amplitud y fase.',
  lead:'Hay movimiento armónico simple (MAS) cuando la fuerza neta empuja siempre hacia el equilibrio y es proporcional a lo que te alejaste. El resultado es una oscilación que se describe con un coseno.',
  sections:[
  {id:'idea',label:'¿Cuándo hay MAS?',html:`
<p>Un resorte ideal tira con ${m('F=-kx')}: cuanto más lo estirás, más fuerte tira, y siempre hacia el equilibrio. ${simple('El signo menos dice “hacia el otro lado”')}</p>
${chain([R`m\,x''=-k\,x`,'Newton con la fuerza del resorte'],[R`x''+\frac km\,x=0`,'paso todo a un lado'],[R`x''+\Omega^2x=0,\quad \Omega=\sqrt{\tfrac km}`,'ecuación del MAS'])}
${key(R`a=-\Omega^2\,x`,'Firma del MAS')}
${idea('Cómo reconocerlo en un ejercicio',`<p>Si después de plantear Newton (o torques) te queda “derivada segunda = − (algo positivo) × la misma variable”, es un MAS y lo que multiplica es ${m('\\Omega^2')}. Este mismo truco sirve para péndulos (C8).</p>`)}
${lab('spring','Resorte en vivo','Cambiá k, m y la amplitud. Mirá cómo cambia el período y el gráfico x(t).',slider('k','k (N/m)',20,400,10,200)+slider('m','m (kg)',0.1,2,0.1,0.5)+slider('A','A (cm)',1,10,0.5,5)+`<svg class="stage" viewBox="0 0 480 230" data-stage></svg><div class="btnRow"><button type="button" class="btn primary" data-play>⏸ Pausa</button></div>`+out)}
`},
  {id:'solucion',label:'La solución x(t)',html:`
${key(R`x(t)=A\cos(\Omega t+\varphi)`,'Posición')}
${chain([R`v(t)=-\Omega A\sin(\Omega t+\varphi)`,'derivo una vez'],[R`a(t)=-\Omega^2A\cos(\Omega t+\varphi)=-\Omega^2x`,'derivo otra vez'])}
${sym([['x','apartamiento desde el equilibrio','m'],['A','amplitud: apartamiento máximo','m'],[R`\Omega`,'frecuencia angular del MAS','rad/s'],[R`\varphi`,'fase inicial','rad'],['T','período: tiempo de una oscilación','s'],['f','frecuencia: oscilaciones por segundo','Hz']])}
${chain([R`\Omega=\frac{2\pi}{T}=2\pi f`],[R`T=2\pi\sqrt{\frac mk}`,'resorte'],[R`f=\frac1T`])}
${keys([[R`v_{max}=\Omega A`,'En el equilibrio'],[R`a_{max}=\Omega^2A`,'En los extremos']])}
${warn('Ω no es ω',`<p>Usamos ${m('\\Omega')} para la frecuencia angular de la oscilación y dejamos ${m('\\omega')} para la velocidad angular de algo que gira. En el péndulo físico aparecen las dos y no son lo mismo.</p>`)}
${idea('El período no depende de la amplitud',`<p>Un resorte tarda lo mismo en oscilar 1 cm que 10 cm: más lejos, pero con más fuerza y más velocidad.</p>`)}
`},
  {id:'iniciales',label:'Amplitud y fase con condiciones iniciales',html:`
<p>A y φ salen de dónde está y qué velocidad tiene en ${m('t=0')}:</p>
${chain([R`x_0=A\cos\varphi`,'x(0)'],[R`v_0=-\Omega A\sin\varphi`,'v(0)'],[R`A=\sqrt{x_0^2+\left(\frac{v_0}{\Omega}\right)^2}`,'sumo cuadrados'],[R`\tan\varphi=-\frac{v_0}{\Omega\,x_0}`,'divido (ojo el cuadrante)'])}
${table(['Cómo arranca','Condiciones','Conviene escribir'],[
 ['Lo separás y lo soltás',m('x_0=A,\\ v_0=0'),m('x=A\\cos(\\Omega t)')],
 ['Parte del equilibrio con un golpe',m('x_0=0,\\ v_0'),m('x=\\tfrac{v_0}{\\Omega}\\sin(\\Omega t)')],
 ['Caso general',m('x_0,\\ v_0'),'las dos ecuaciones de arriba']])}
${example('Amplitud y fase',
  `Un bloque de 0,5 kg unido a un resorte de 200 N/m pasa por ${m('x_0=3\\ \\mathrm{cm}')} con ${m('v_0=0{,}8\\ \\mathrm{m/s}')} hacia +x en t = 0. Hallá Ω, T, A y φ.`,
  chain([R`\Omega=\sqrt{\tfrac{200}{0{,}5}}=20\ \mathrm{rad/s}`],[R`T=\tfrac{2\pi}{20}=0{,}314\ \mathrm s`],[R`A=\sqrt{0{,}03^2+\left(\tfrac{0{,}8}{20}\right)^2}=\sqrt{0{,}0009+0{,}0016}=0{,}05\ \mathrm m`],[R`\cos\varphi=\tfrac{0{,}03}{0{,}05}=0{,}6\qquad \sin\varphi=-\tfrac{0{,}8}{20\cdot0{,}05}=-0{,}8`],[R`\varphi\approx-0{,}927\ \mathrm{rad}\ (-53^\circ)`,'cuarto cuadrante']),
  `${m('x(t)=0{,}05\\cos(20t-0{,}927)')} en metros. ${simple('φ negativo: “va camino” al máximo')}`)}
${warn('No confundas amplitud con posición inicial',`<p>Si arranca en el equilibrio con velocidad, ${m('x_0=0')} pero ${m('A\\ne0')}: ${m('A=v_0/\\Omega')}.</p>`)}
`},
  {id:'vertical',label:'Resorte vertical y resortes combinados',html:`
${fig(F.vspring,'Si medís desde el equilibrio, el peso ya está “descontado”.')}
<p>Colgado, el resorte se estira hasta que la fuerza elástica equilibra al peso. Ese es el nuevo equilibrio:</p>
${chain([R`k\,(y_e-l_0)=m\,g`,'equilibrio'],[R`y_e=l_0+\frac{mg}{k}`],[R`\delta y=y-y_e\qquad F_y=-k\,\delta y`,'medido desde el equilibrio'])}
${idea('Lo bueno',`<p>Medido desde ${m('y_e')}, la ecuación queda igual que la horizontal: ${m("\\delta y''+\\tfrac km\\,\\delta y=0")}. El período es el mismo: ${m('2\\pi\\sqrt{m/k}')}. La gravedad sólo corre el centro de la oscilación.</p>`)}
${err('Sumar mg dos veces',`<p>Si ya tomaste el origen en el equilibrio, no vuelvas a poner el peso en la ecuación.</p>`)}
<h3>Dos resortes que actúan juntos</h3>
${key(R`k_{eq}=k_1+k_2`,'Uno de cada lado, o los dos en paralelo')}
<p>Si un bloque está entre dos resortes (uno a cada lado), al moverlo uno se estira y el otro se comprime: <b>los dos</b> empujan hacia el equilibrio y sus constantes se suman.</p>
`},
  {id:'repaso',label:'Errores y repaso',html:`
${cards([['Firma','¿Qué ecuación indica MAS?','x″ + Ω²·x = 0  (o a = −Ω²·x)'],
['Fórmula','Período de un resorte','T = 2π·√(m/k)'],
['Máximos','¿Dónde es máxima la velocidad? ¿Y la aceleración?','v máx = ΩA en el equilibrio; a máx = Ω²A en los extremos.'],
['Condiciones','Amplitud a partir de x₀ y v₀','A = √(x₀² + (v₀/Ω)²)'],
['Vertical','¿Cambia el período si cuelga verticalmente?','No. Sólo se corre el equilibrio a yₑ = l₀ + mg/k.'],
['Trampa','¿T depende de la amplitud?','No, en el MAS ideal.']])}
`}]});

  /* ---------------- C7 ---------------- */
  T.push({id:'C7',group:'osc',title:'Energía en el MAS',short:'La energía va y viene entre cinética y potencial.',
  lead:'Sin rozamiento, la energía mecánica de un oscilador no cambia: sólo se pasa de potencial (en los extremos) a cinética (en el centro) y vuelta.',
  sections:[
  {id:'balance',label:'El balance',html:`
${keys([[R`U=\tfrac12k\,x^2`,'Potencial elástica'],[R`E_c=\tfrac12m\,v^2`,'Cinética'],[R`E_m=\tfrac12k\,A^2`,'Total (constante)']])}
${chain([R`\tfrac12kA^2=\tfrac12mv^2+\tfrac12kx^2`,'conservación'],[R`E_c(x)=\tfrac12k\left(A^2-x^2\right)`,'cinética en cada posición'],[R`v(x)=\Omega\sqrt{A^2-x^2}`,'velocidad sin usar el tiempo'])}
${two(idea('En los extremos x = ±A',`<p>${m('v=0')}: toda la energía es potencial.</p>`),idea('En el equilibrio x = 0',`<p>${m('v=v_{max}')}: toda la energía es cinética.</p>`))}
${lab('energy','Energía que va y viene','Mirá las barras: la suma queda fija.',slider('A','Amplitud (cm)',1,10,0.5,5)+`<svg class="stage" viewBox="0 0 480 120" data-stage></svg><div class="bars"><div class="bar"><span>U</span><div><i data-u style="background:var(--violet)"></i></div><em data-ut></em></div><div class="bar"><span>E_c</span><div><i data-k style="background:var(--accent)"></i></div><em data-kt></em></div><div class="bar"><span>Total</span><div><i data-e style="background:var(--ok)"></i></div><em data-et></em></div></div>`+out)}
`},
  {id:'tiempo',label:'Energía en función del tiempo',html:`
${chain([R`U(t)=\tfrac12kA^2\cos^2(\Omega t+\varphi)`],[R`E_c(t)=\tfrac12kA^2\sin^2(\Omega t+\varphi)`],[R`U+E_c=\tfrac12kA^2\left(\cos^2+\sin^2\right)=\tfrac12kA^2`,'cos² + sen² = 1'])}
${idea('En los gráficos',`<p>U y E_c oscilan <b>al doble de frecuencia</b> que x (cada oscilación pasa dos veces por cada extremo) y nunca son negativas. Son espejos: cuando una es máxima, la otra es cero.</p>`)}
${example('Velocidad en una posición',
  `Mismo oscilador de C6: k = 200 N/m, m = 0,5 kg, A = 5 cm. ¿Cuál es la energía total y qué velocidad tiene en x = 3 cm?`,
  chain([R`E_m=\tfrac12(200)(0{,}05)^2=0{,}25\ \mathrm J`],[R`E_c=\tfrac12(200)\left(0{,}05^2-0{,}03^2\right)=0{,}16\ \mathrm J`],[R`v=\sqrt{\tfrac{2\cdot0{,}16}{0{,}5}}=0{,}8\ \mathrm{m/s}`,'coincide con v₀ de C6 ✓']),
  `${m('E_m=0{,}25\\ \\mathrm J')} y ${m('v=0{,}8\\ \\mathrm{m/s}')}.`)}
${cards([['Fórmula','Energía total de un MAS','E = ½·k·A²'],['Uso','¿Cómo hallar v en una posición x sin el tiempo?','½k(A² − x²) = ½mv² → v = Ω·√(A² − x²)'],['Gráfico','¿Con qué frecuencia oscilan U y E_c?','Al doble que x.'],['Concepto','¿Dónde toda la energía es potencial?','En los extremos, x = ±A.']])}
`}]});

  /* ---------------- C8 ---------------- */
  T.push({id:'C8',group:'osc',title:'Péndulos',short:'Simple (masa + hilo) y físico (cuerpo rígido).',
  lead:'Un péndulo es un MAS “disfrazado”: para ángulos chicos, el torque del peso es proporcional al ángulo y sale la misma ecuación que el resorte.',
  sections:[
  {id:'simple',label:'Péndulo simple',html:`
${fig(F.pendulums,'Simple: toda la masa en un punto. Físico: un cuerpo con tamaño que cuelga de un pivote.')}
<p>La componente del peso a lo largo de la trayectoria es ${m('-mg\\sin\\theta')}. Para ángulos chicos, ${m('\\sin\\theta\\approx\\theta')} (en radianes):</p>
${chain([R`m\,L\,\theta''=-m\,g\sin\theta`,'Newton tangencial'],[R`\theta''+\frac gL\,\sin\theta=0`],[R`\theta''+\frac gL\,\theta=0`,'ángulo chico: sen θ ≈ θ'],[R`\Omega=\sqrt{\frac gL}`,'MAS'])}
${key(R`T=2\pi\sqrt{\frac Lg}`,'Péndulo simple')}
${idea('No depende de la masa',`<p>Más masa → más peso, pero también más inercia: se compensan. Sólo importan L y g.</p>`)}
`},
  {id:'fisico',label:'Péndulo físico',html:`
<p>Ahora el cuerpo tiene tamaño. El peso actúa en el CM, a distancia d del pivote, y hace torque restaurador:</p>
${sym([['M','masa total','kg'],['d','distancia del pivote al centro de masa','m'],[R`I_P`,'momento de inercia respecto del pivote','kg·m²'],[R`I_{CM}`,'momento respecto del centro de masa','kg·m²']])}
${chain([R`\tau=-M\,g\,d\sin\theta`,'torque del peso'],[R`I_P\,\theta''=-M\,g\,d\,\theta`,'Στ = Iα con sen θ ≈ θ'],[R`\Omega=\sqrt{\frac{M\,g\,d}{I_P}}`],[R`I_P=I_{CM}+M\,d^2`,'casi siempre con Steiner'])}
${key(R`T=2\pi\sqrt{\frac{I_P}{M\,g\,d}}`,'Péndulo físico')}
${idea('Chequeo',`<p>Si toda la masa está en un punto a distancia L: ${m('I_P=ML^2')}, ${m('d=L')} y queda ${m('2\\pi\\sqrt{L/g}')}. El simple es un caso particular del físico.</p>`)}
${table(['Cuerpo y pivote','I_P','d','T'],[
 ['Varilla colgada de un extremo',m('\\tfrac13ML^2'),m('\\tfrac L2'),m('2\\pi\\sqrt{\\tfrac{2L}{3g}}')],
 ['Disco colgado de un punto del borde',m('\\tfrac32MR^2'),m('R'),m('2\\pi\\sqrt{\\tfrac{3R}{2g}}')],
 ['Aro colgado de un punto',m('2MR^2'),m('R'),m('2\\pi\\sqrt{\\tfrac{2R}{g}}')]])}
${example('Varilla de 1 m colgada de un extremo',
  `Comparala con un péndulo simple de 1 m (g = 9,8 m/s²).`,
  chain([R`T_{simple}=2\pi\sqrt{\tfrac{1}{9{,}8}}=2{,}01\ \mathrm s`],[R`T_{varilla}=2\pi\sqrt{\frac{\tfrac13ML^2}{Mg\,\tfrac L2}}=2\pi\sqrt{\frac{2L}{3g}}`],[R`T_{varilla}=2\pi\sqrt{\tfrac{2}{29{,}4}}=1{,}64\ \mathrm s`]),
  `La varilla oscila más rápido (1,64 s contra 2,01 s): su masa está repartida y “en promedio” más cerca del pivote.`)}
${example('Disco colgado del borde',
  `Un disco de radio 20 cm cuelga de un clavo que pasa por un punto de su borde. ¿Período de pequeñas oscilaciones?`,
  chain([R`I_P=\tfrac12MR^2+MR^2=\tfrac32MR^2`,'Steiner, d = R'],[R`T=2\pi\sqrt{\frac{\tfrac32MR^2}{MgR}}=2\pi\sqrt{\frac{3R}{2g}}`],[R`T=2\pi\sqrt{\tfrac{0{,}6}{19{,}6}}\approx1{,}10\ \mathrm s`]),
  `${m('T\\approx1{,}10\\ \\mathrm s')} (no depende de la masa).`)}
`},
  {id:'minimo',label:'Período mínimo y energía',html:`
<p>Si corrés el pivote a lo largo del cuerpo, el período cambia. Hay una distancia que lo hace mínimo:</p>
${chain([R`T(d)=2\pi\sqrt{\frac{I_{CM}+Md^2}{M\,g\,d}}`],[R`\frac{dT}{dd}=0\ \Rightarrow\ Md^2=I_{CM}`],[R`d_{min}=\sqrt{\frac{I_{CM}}{M}}`,'“radio de giro”'])}
${lab('physpend','Período de una varilla según dónde la cuelgues','Varilla de 1 m. Mové el pivote: con d muy chico o muy grande el período crece.',slider('d','d (cm)',3,50,1,29)+`<svg class="stage" viewBox="0 0 480 230" data-stage></svg>`+out)}
<h3>Con energía</h3>
${chain([R`\Delta U=M\,g\,d\,(1-\cos\theta)`,'el CM sube'],[R`E_{c,rot}=\tfrac12\,I_P\,\omega_{ang}^2`,'gira alrededor del pivote'],[R`\omega_{ang,max}=\Omega\,\theta_{max}`,'si es MAS'])}
${warn('Dos “omegas”',`<p>${m('\\Omega')} es cuánto “late” la oscilación (fija). ${m('\\omega_{ang}')} es la velocidad angular del cuerpo en cada instante (vale 0 en los extremos y ${m('\\Omega\\theta_{max}')} abajo).</p>`)}
${err('Errores típicos',ul(['Usar grados en '+m('\\sin\\theta\\approx\\theta')+': siempre radianes.','Usar el péndulo simple cuando el cuerpo tiene tamaño.','Olvidar Steiner si el pivote no pasa por el CM.','Poner '+m('I_{CM}')+' en la fórmula del período en lugar de '+m('I_P')+'.']))}
${cards([['Fórmula','Período del péndulo simple','T = 2π·√(L/g)'],['Fórmula','Período del péndulo físico','T = 2π·√(I_P / (M·g·d))'],['Concepto','¿Qué es d en el péndulo físico?','La distancia del pivote al centro de masa.'],['Resultado','¿Dónde colgarlo para que el período sea mínimo?','A d = √(I_CM/M) del centro de masa.'],['Trampa','¿Se puede usar sen θ ≈ θ con θ en grados?','No: sólo en radianes.']])}
`}]});
})();
</script>
<script>
/* ================= 4c) Contenido · Fluidos (C9–C13) y cómo elegir (C14) ================= */
(function(){
  'use strict';
  const K=window.Kit,F=window.FIG,R=String.raw;
  const {M,m,chain,key,keys,sym,simple,idea,warn,err,ok,two,ul,ol,deep,example,step,table,fig,cards,lab,field,select,fields,slider,out}=K;
  const T=window.TOPICS;
  const decide=rows=>`<div class="decide">${rows.map(([si,tema,f])=>`<div><small>Si tiene…</small><b>${si}</b><span>→ ${tema}</span><div class="decideF">${f}</div></div>`).join('')}</div>`;

  /* ---------------- C9 ---------------- */
  T.push({id:'C9',group:'est',title:'Fluidos en reposo: presión',short:'p = p₀ + ρgh, absoluta y manométrica, capas.',
  lead:'En un fluido quieto la presión crece con la profundidad, porque cada punto soporta el peso de la columna de fluido que tiene encima.',
  sections:[
  {id:'presion',label:'¿Qué es la presión?',html:`
${key(R`p=\frac{F_n}{A}`,'Fuerza normal por unidad de área')}
${chain([R`F=p\,A`,'fuerza sobre una superficie plana'],[R`1\ \mathrm{Pa}=1\ \mathrm{N/m^2}`],[R`1\ \mathrm{atm}=1{,}013\times10^5\ \mathrm{Pa}=760\ \mathrm{mmHg}`])}
<p>La presión no tiene dirección: en un punto del fluido empuja igual para todos lados y siempre perpendicular a cualquier pared. ${simple('Por eso el agua empuja las paredes de una pileta hacia afuera y el fondo hacia abajo')}</p>
`},
  {id:'profundidad',label:'Presión y profundidad',html:`
<p>Tomemos una “columna” de fluido de área A y alto h. Para que esté quieta, la fuerza de abajo tiene que sostener la de arriba más su peso:</p>
${chain([R`p\,A=p_0\,A+\rho\,(A\,h)\,g`,'equilibrio de la columna'],[R`p=p_0+\rho\,g\,h`,'divido por A'])}
${key(R`p=p_0+\rho\,g\,h`,'Teorema fundamental de la hidrostática')}
${sym([['p','presión a profundidad h','Pa'],[R`p_0`,'presión en la superficie (p_atm si está abierto)','Pa'],[R`\rho`,'densidad del fluido (no del objeto)','kg/m³'],['h','profundidad, medida hacia abajo','m']])}
${deep('La forma diferencial',`<p>Si medís la altura y hacia arriba, la presión disminuye al subir:</p>${M(R`\frac{dp}{dy}=-\rho\,g`)}<p>Integrando con ρ constante (líquidos) se vuelve a ${m('p=p_0+\\rho gh')}. En gases ρ cambia con la altura y la cuenta es distinta (por eso la presión atmosférica no baja linealmente).</p>`)}
${two(idea('Misma altura, misma presión',`<p>En un mismo fluido quieto y conectado, todos los puntos a la misma altura tienen la misma presión. <b>No importa la forma del recipiente</b>.</p>`),
      idea('Absoluta y manométrica',`${M(R`p_{abs}=p_{atm}+p_{man}`)}<p>La manométrica es “cuánto más que la atmósfera”. En un recipiente abierto: ${m('p_{man}=\\rho g h')}.</p>`))}
${example('Presión a 10 m de profundidad',
  `¿Cuál es la presión absoluta y la manométrica a 10 m bajo la superficie del agua? (ρ = 1000 kg/m³, g = 9,8 m/s²)`,
  chain([R`p_{man}=1000\cdot9{,}8\cdot10=98\,000\ \mathrm{Pa}`],[R`p_{abs}=101\,300+98\,000=199\,300\ \mathrm{Pa}\approx1{,}97\ \mathrm{atm}`]),
  `Cada 10 m de agua suman casi 1 atm.`)}
`},
  {id:'capas',label:'Varios fluidos en capas',html:`
${fig(F.layers,'Al bajar por cada capa, sumás ρ g h de esa capa.')}
${key(R`p=p_0+\rho_1g\,h_1+\rho_2g\,h_2+\dots`,'Se suma capa por capa')}
${example('Aceite sobre agua',
  `Un recipiente abierto tiene 0,5 m de aceite (ρ = 800 kg/m³) sobre 1 m de agua. ¿Presión manométrica en el fondo?`,
  chain([R`p_{man}=800\cdot9{,}8\cdot0{,}5+1000\cdot9{,}8\cdot1`],[R`p_{man}=3920+9800=13\,720\ \mathrm{Pa}`]),`${m('p_{man}=13{,}7\\ \\mathrm{kPa}')}`)}
${lab('depth','Presión en el fondo de dos capas','Cambiá alturas y densidades.',fields(field('r1','ρ capa de arriba (kg/m³)',800),field('h1','h₁ (m)',0.5),field('r2','ρ capa de abajo (kg/m³)',1000),field('h2','h₂ (m)',1),select('p0','Superficie',[['101300','Abierta (p_atm)'],['0','Sólo manométrica']]))+out)}
${err('Errores típicos',ul(['Confundir presión absoluta y manométrica: fijate qué te piden.','Usar la densidad del objeto en lugar de la del fluido.','Usar una sola ρ cuando hay aceite, agua y mercurio: dividí en tramos.']))}
${cards([['Fórmula','Presión a profundidad h','p = p₀ + ρ·g·h'],['Concepto','¿Depende de la forma del recipiente?','No, sólo de la profundidad (paradoja hidrostática).'],['Definición','Presión manométrica','p_man = p_abs − p_atm'],['Dato','¿Cuánto suman 10 m de agua?','≈ 98 kPa ≈ 1 atm']])}
`}]});

  /* ---------------- C10 ---------------- */
  T.push({id:'C10',group:'est',title:'Pascal, manómetros y barómetro',short:'Prensa hidráulica y cómo “recorrer” un tubo en U.',
  lead:'Un cambio de presión en un líquido encerrado se transmite entero a todo el líquido. Con eso funcionan la prensa hidráulica y los manómetros.',
  sections:[
  {id:'pascal',label:'Principio de Pascal',html:`
${fig(F.press,'La presión es la misma en los dos pistones (a igual altura).')}
${chain([R`\frac{F_1}{A_1}=\frac{F_2}{A_2}`,'misma presión'],[R`F_2=\frac{A_2}{A_1}\,F_1`,'multiplicador de fuerza'])}
${idea('No se gana energía',`<p>El pistón grande se mueve menos: ${m('A_1\\,\\Delta x_1=A_2\\,\\Delta x_2')} (el volumen que entra es el que sale). El trabajo ${m('F\\Delta x')} es el mismo en los dos lados.</p>`)}
${example('Prensa hidráulica',
  `Pistón chico de 2 cm de diámetro, grande de 20 cm. Se empuja el chico con 50 N. ¿Qué fuerza hace el grande?`,
  chain([R`\frac{A_2}{A_1}=\left(\frac{D_2}{D_1}\right)^2=\left(\frac{20}{2}\right)^2=100`,'el área va con D²'],[R`F_2=100\cdot50=5000\ \mathrm N`]),
  `${m('F_2=5000\\ \\mathrm N')}. ${simple('Diez veces el diámetro es cien veces la fuerza')}`)}
`},
  {id:'manometro',label:'Cómo recorrer un manómetro',html:`
${fig(F.utube,'Los puntos 1 y 2 están a la misma altura en el mismo fluido (mercurio): tienen igual presión.')}
<div class="box method"><b>Regla para recorrer</b>${ol(['Arrancá en un punto donde conozcas la presión.','<b>Bajás</b> una altura h dentro de un fluido → <b>sumás</b> '+m('\\rho g h')+'.','<b>Subís</b> una altura h → <b>restás</b> '+m('\\rho g h')+'.','Sólo podés igualar presiones a la misma altura <b>dentro del mismo fluido conectado</b>.','Llegá al otro punto y despejá.'])}</div>
${keys([[R`p=p_{atm}\pm\rho g h`,'Tubo en U abierto'],[R`\Delta p=(\rho_m-\rho_f)\,g\,h`,'Manómetro que mide una cañería con otro fluido']])}
${deep('¿De dónde sale (ρ_m − ρ_f)?',`<p>Si el manómetro de mercurio (ρ_m) está conectado a una cañería con agua (ρ_f), las dos ramas tienen agua encima del mercurio. Recorriendo desde 1 hasta 2:</p>
${chain([R`p_1+\rho_f\,g\,(y+h)-\rho_m\,g\,h-\rho_f\,g\,y=p_2`,'bajo por agua, subo h por Hg, subo por agua'],[R`p_1-p_2=(\rho_m-\rho_f)\,g\,h`,'los tramos de agua de igual largo se cancelan'])}
<p>El agua que “sobra” en una rama compensa parte del mercurio: por eso se resta ${m('\\rho_f')}.</p>`)}
${example('Gas en un tanque',
  `Un manómetro de mercurio abierto marca h = 20 cm (rama libre más alta). ¿Presión manométrica del gas? (ρ_Hg = 13 600 kg/m³)`,
  chain([R`p_{man}=\rho_{Hg}\,g\,h=13\,600\cdot9{,}8\cdot0{,}2`],[R`p_{man}\approx26\,660\ \mathrm{Pa}\approx26{,}7\ \mathrm{kPa}`]),`${m('p_{man}\\approx26{,}7\\ \\mathrm{kPa}')} (≈ 200 mmHg).`)}
`},
  {id:'barometro',label:'Barómetro',html:`
<p>Un tubo lleno de mercurio, dado vuelta sobre una cubeta: arriba queda vacío (p ≈ 0) y la columna que sostiene la atmósfera mide unos 76 cm.</p>
${chain([R`p_{atm}=\rho_{Hg}\,g\,h`],[R`p_{atm}=13\,600\cdot9{,}8\cdot0{,}76\approx1{,}013\times10^5\ \mathrm{Pa}`],[R`1\ \mathrm{mmHg}\approx133\ \mathrm{Pa}`])}
${cards([['Ley','Principio de Pascal','La presión aplicada a un fluido encerrado se transmite igual a todos sus puntos.'],['Regla','Recorriendo un manómetro: bajar / subir','Bajar suma ρgh, subir resta ρgh.'],['Fórmula','Manómetro de Hg en una cañería de agua','Δp = (ρ_Hg − ρ_agua)·g·h'],['Dato','Equivalencias de la atmósfera','1 atm = 760 mmHg = 1,013·10⁵ Pa']])}
`}]});

  /* ---------------- C11 ---------------- */
  T.push({id:'C11',group:'est',title:'Empuje y flotación',short:'Arquímedes, peso aparente y cuerpos entre dos líquidos.',
  lead:'Todo cuerpo sumergido recibe un empuje hacia arriba igual al peso del fluido que desaloja. Ese empuje es la diferencia de presión entre su cara de abajo y la de arriba.',
  sections:[
  {id:'arquimedes',label:'Principio de Arquímedes',html:`
${key(R`E=\rho_{fluido}\;g\;V_{sumergido}`,'Empuje')}
${deep('¿Por qué existe el empuje?',`<p>Un cubo sumergido tiene la cara de abajo más profunda que la de arriba, entonces la presión abajo es mayor. Las fuerzas laterales se cancelan; las verticales no:</p>
${chain([R`E=(p_{abajo}-p_{arriba})\,A`],[R`E=\rho_f\,g\,(h_2-h_1)\,A=\rho_f\,g\,V`,'h₂ − h₁ es la altura del cubo'])}
<p>No depende de qué tan hondo esté (en un líquido incompresible), sólo del volumen sumergido.</p>`)}
${warn('Qué densidad va',`<p>En el empuje va la densidad <b>del fluido</b> y el volumen <b>sumergido</b>. La densidad del objeto sólo aparece en su peso: ${m('P=\\rho_{cuerpo}\\,g\\,V_{total}')}.</p>`)}
${example('Empuje sobre 2 litros de agua',``,chain([R`E=1000\cdot9{,}8\cdot0{,}002=19{,}6\ \mathrm N`]),`${m('E=19{,}6\\ \\mathrm N')}`)}
`},
  {id:'flotar',label:'Flotar o hundirse',html:`
${fig(F.float,'Flota en equilibrio cuando el empuje de la parte sumergida iguala al peso.')}
${chain([R`E=P`,'si flota en equilibrio'],[R`\rho_f\,g\,V_{sum}=\rho_c\,g\,V_{total}`],[R`\frac{V_{sum}}{V_{total}}=\frac{\rho_c}{\rho_f}`,'fracción sumergida'])}
${table(['Si…','Pasa que…'],[[m('\\rho_c<\\rho_f'),'flota con una parte afuera'],[m('\\rho_c=\\rho_f'),'queda “en equilibrio” a cualquier profundidad'],[m('\\rho_c>\\rho_f'),'se hunde (el empuje máximo no alcanza)']])}
${lab('float','¿Cuánto se hunde?','Elegí la densidad del cuerpo y del líquido.',slider('rc','ρ cuerpo (kg/m³)',100,1500,10,600)+fields(select('rf','Líquido',[['1000','Agua (1000)'],['800','Aceite (800)'],['1030','Agua de mar (1030)'],['13600','Mercurio (13 600)']]))+`<svg class="stage" viewBox="0 0 480 200" data-stage></svg>`+out)}
<h3>Entre dos líquidos</h3>
${chain([R`E_{total}=\rho_1\,g\,V_1+\rho_2\,g\,V_2`,'empuje por partes'],[R`\rho_c\,V_{total}=\rho_1V_1+\rho_2V_2`,'si flota'])}
${example('Bloque entre aceite y agua',
  `Un bloque de densidad 900 kg/m³ flota en la interfaz aceite (800) – agua (1000), totalmente sumergido. ¿Qué fracción está en el agua?`,
  chain([R`900=1000\,x+800\,(1-x)`,'x = fracción en agua'],[R`900=800+200\,x\ \Rightarrow\ x=0{,}5`]),`La mitad en agua y la mitad en aceite.`)}
`},
  {id:'aparente',label:'Peso aparente y balanzas',html:`
${chain([R`T=P-E`,'cuerpo colgado de una cuerda y sumergido'],[R`P_{ap}=P-E`,'lo que marca un dinamómetro'])}
${example('Piedra colgada en agua',
  `Una piedra de 2 kg y 0,8 L cuelga de un hilo totalmente sumergida en agua. ¿Tensión del hilo?`,
  chain([R`P=2\cdot9{,}8=19{,}6\ \mathrm N`],[R`E=1000\cdot9{,}8\cdot0{,}0008=7{,}84\ \mathrm N`],[R`T=19{,}6-7{,}84=11{,}76\ \mathrm N`]),`${m('T\\approx11{,}8\\ \\mathrm N')}`)}
<h3>Las dos balanzas</h3>
${keys([[R`L=P_{bloque}-E`,'Dinamómetro del que cuelga el bloque'],[R`L=P_{rec}+P_{liq}+E`,'Balanza debajo del recipiente']])}
${idea('Acción y reacción',`<p>Si el líquido empuja al bloque hacia arriba con E, el bloque empuja al líquido hacia abajo con E. Por eso la balanza de abajo marca <b>E de más</b> (y la de arriba, E de menos).</p>`)}
${err('Errores típicos',ul(['Usar el volumen total cuando el cuerpo no está entero bajo el líquido.','Olvidar que la balanza del recipiente aumenta en E.','Pensar que a más profundidad hay más empuje (en un líquido no).','Boya + cuerpo pesado: conviene analizar el sistema completo con '+m('E_{total}=P_{total}')+'.']))}
${cards([['Ley','Principio de Arquímedes','E = ρ_fluido·g·V_sumergido, hacia arriba.'],['Fórmula','Fracción sumergida de un cuerpo que flota','V_sum / V_total = ρ_cuerpo / ρ_fluido'],['Fórmula','Peso aparente','P_ap = P − E'],['Trampa','¿Qué marca la balanza de abajo al sumergir un cuerpo colgado?','Lo de antes + E (reacción del empuje).']])}
`}]});

  /* ---------------- C12 ---------------- */
  T.push({id:'C12',group:'din',title:'Fluidos en movimiento',short:'Caudal, continuidad y Bernoulli.',
  lead:'Para fluidos ideales que circulan alcanzan dos leyes: la masa se conserva (continuidad) y la energía se conserva (Bernoulli).',
  sections:[
  {id:'continuidad',label:'Caudal y continuidad',html:`
${sym([['Q','caudal: volumen por unidad de tiempo','m³/s · L/s'],['A','área de la sección','m²'],['D','diámetro de la sección','m'],['v','velocidad del fluido','m/s']])}
${chain([R`Q=A\,v`,'caudal'],[R`A=\frac{\pi D^2}{4}`,'sección circular'],[R`v=\frac QA`],[R`1\ \mathrm L=10^{-3}\ \mathrm{m^3}`])}
${key(R`A_1\,v_1=A_2\,v_2\qquad (Q_1=Q_2)`,'Continuidad (fluido incompresible)')}
<p>Lo que entra por un lado tiene que salir por el otro. Si el caño se angosta, el fluido acelera. ${simple('Como cuando tapás media manguera con el dedo')}</p>
${warn('El área va con D²',`<p>Si el diámetro se reduce a la mitad, el área se reduce a la cuarta parte y la velocidad se <b>cuadruplica</b>.</p>`)}
`},
  {id:'bernoulli',label:'Bernoulli',html:`
${key(R`p+\rho\,g\,y+\tfrac12\rho\,v^2=\text{cte.}`,'Ecuación de Bernoulli')}
${chain([R`p_1+\rho g\,y_1+\tfrac12\rho v_1^2=p_2+\rho g\,y_2+\tfrac12\rho v_2^2`,'entre dos puntos de una línea de corriente'])}
${table(['Término','Qué representa'],[[m('p'),'energía de presión por unidad de volumen'],[m('\\rho g y'),'energía potencial por unidad de volumen'],[m('\\tfrac12\\rho v^2'),'energía cinética por unidad de volumen']])}
${ok('Cuándo se puede usar',ul(['Flujo estacionario (no cambia con el tiempo).','Fluido incompresible.','Sin viscosidad, sin pérdidas, sin bombas ni turbinas en el medio.','Sobre una misma línea de corriente.']))}
<h3>Caño horizontal</h3>
${fig(F.pipe,'En la parte angosta: más velocidad, menos presión.')}
${chain([R`p_1+\tfrac12\rho v_1^2=p_2+\tfrac12\rho v_2^2`,'se cancela ρgy'],[R`p_1-p_2=\tfrac12\rho\left(v_2^2-v_1^2\right)`])}
${idea('Efecto Venturi',`<p>Donde el fluido va más rápido, la presión es menor. No es intuitivo, pero es pura conservación de la energía: si gana cinética, pierde de presión.</p>`)}
${example('Caño que se angosta',
  `Por un caño horizontal de 4 cm de diámetro circula agua a 1 m/s. Se angosta a 2 cm. Hallá v₂, el caudal y la diferencia de presión.`,
  chain([R`v_2=v_1\left(\frac{D_1}{D_2}\right)^2=1\cdot4=4\ \mathrm{m/s}`,'continuidad'],[R`Q=\pi(0{,}02)^2\cdot1\approx1{,}26\times10^{-3}\ \mathrm{m^3/s}`,'≈ 1,26 L/s'],[R`p_1-p_2=\tfrac12\cdot1000\,(16-1)=7500\ \mathrm{Pa}`,'Bernoulli horizontal']),
  `${m('v_2=4\\ \\mathrm{m/s}')}, ${m('Q\\approx1{,}26\\ \\mathrm{L/s}')}, ${m('p_1-p_2=7{,}5\\ \\mathrm{kPa}')}.`)}
${lab('bernoulli','Continuidad + Bernoulli','Caño con dos secciones y desnivel opcional (agua).',fields(field('d1','D₁ (cm)',4),field('d2','D₂ (cm)',2),field('v1','v₁ (m/s)',1),field('dy','y₂ − y₁ (m)',0))+out)}
${err('Errores típicos',ul(['Usar Bernoulli sin continuidad: casi siempre necesitás las dos.','Olvidar '+m('\\rho g y')+' si el caño no es horizontal.','Sumar la presión atmosférica cuando aparece de los dos lados (se cancela).']))}
${cards([['Ley','Continuidad','A₁·v₁ = A₂·v₂ (se conserva el caudal).'],['Ley','Bernoulli','p + ρgy + ½ρv² = constante sobre una línea de corriente.'],['Concepto','Caño horizontal que se angosta: ¿qué pasa con p?','Baja, porque sube la velocidad.'],['Trampa','D se reduce a la mitad: ¿v?','Se multiplica por 4 (A va con D²).']])}
`}]});

  /* ---------------- C13 ---------------- */
  T.push({id:'C13',group:'din',title:'Venturi, Pitot y Torricelli',short:'Medidores de caudal y velocidad de salida de tanques.',
  lead:'Tres aplicaciones directas de continuidad + Bernoulli que aparecen siempre en los parciales.',
  sections:[
  {id:'venturi',label:'Tubo de Venturi',html:`
${fig(F.venturi,'El manómetro mide la diferencia de presión entre la parte ancha y la garganta.')}
<div class="box method"><b>Receta</b>${ol(['Continuidad: '+m('A_1v_1=A_2v_2')+'.','Altura del manómetro → '+m('\\Delta p=(\\rho_m-\\rho_f)gh')+'.','Bernoulli horizontal: '+m('p_1-p_2=\\tfrac12\\rho_f(v_2^2-v_1^2)')+'.','Despejá velocidad, caudal, diámetro o altura.'])}</div>
${chain([R`\Delta p=\tfrac12\rho_f\,v_1^2\left[\left(\frac{A_1}{A_2}\right)^2-1\right]`,'reemplazo v₂ = v₁·A₁/A₂'],[R`v_1=\sqrt{\frac{2\,\Delta p}{\rho_f\left[(A_1/A_2)^2-1\right]}}`])}
${example('Venturi con mercurio',
  `Agua circula por un Venturi de 10 cm de diámetro con garganta de 5 cm. El manómetro de mercurio marca h = 5 cm. Hallá v₁ y el caudal.`,
  chain([R`\Delta p=(13\,600-1000)\cdot9{,}8\cdot0{,}05=6174\ \mathrm{Pa}`],[R`\left(\tfrac{A_1}{A_2}\right)^2=\left(\tfrac{10}{5}\right)^4=16`,'A va con D²'],[R`v_1=\sqrt{\frac{2\cdot6174}{1000\cdot15}}\approx0{,}907\ \mathrm{m/s}`],[R`Q=\pi(0{,}05)^2\cdot0{,}907\approx7{,}13\times10^{-3}\ \mathrm{m^3/s}`]),
  `${m('v_1\\approx0{,}91\\ \\mathrm{m/s}')} y ${m('Q\\approx7{,}1\\ \\mathrm{L/s}')}.`)}
${lab('venturi','Calculadora de Venturi','Manómetro diferencial con líquido de densidad ρ_m.',fields(field('d1','D₁ (cm)',10),field('d2','D₂ (cm)',5),field('h','h (cm)',5),field('rm','ρ manómetro (kg/m³)',13600),field('rf','ρ fluido (kg/m³)',1000))+out)}
`},
  {id:'pitot',label:'Tubo de Pitot',html:`
${fig(F.pitot,'En la boca del Pitot el fluido se frena del todo: ahí la presión es máxima.')}
<p>El Pitot compara la presión estática (la del fluido que pasa) con la de <b>estancamiento</b>, donde el fluido queda quieto. Toda la energía cinética se convirtió en presión:</p>
${chain([R`p_{est}=p+\tfrac12\rho v^2`,'Bernoulli con v = 0 en la boca'],[R`v=\sqrt{\frac{2\,(p_{est}-p)}{\rho}}`])}
${keys([[R`v_{Pitot}=\sqrt{2\,g\,h}`,'Leído con columnas del mismo líquido'],[R`v_{Pitot}=\sqrt{\frac{2(\rho_m-\rho_f)\,g\,h}{\rho_f}}`,'Con manómetro diferencial']])}
${example('Pitot en un canal',`Las columnas de agua de un Pitot difieren en 20 cm. ¿Velocidad del agua?`,chain([R`v=\sqrt{2\cdot9{,}8\cdot0{,}2}\approx1{,}98\ \mathrm{m/s}`]),`${m('v\\approx2\\ \\mathrm{m/s}')}`)}
`},
  {id:'torricelli',label:'Torricelli: tanques y chorros',html:`
${fig(F.tank,'Superficie y orificio a presión atmosférica; el tanque es grande, así que la superficie casi no baja.')}
${chain([R`p_{atm}+\rho g\,h+0=p_{atm}+0+\tfrac12\rho v^2`,'Bernoulli de 1 a 2'],[R`v=\sqrt{2\,g\,h}`,'igual que una caída libre de altura h'])}
${key(R`v=\sqrt{2\,g\,h}`,'Teorema de Torricelli')}
${keys([[R`v=\sqrt{\frac{2\,\Delta p}{\rho}+2\,g\,h}`,'Tanque presurizado (Δp manométrica arriba)'],[R`h_{chorro}=\frac{v^2}{2g}`,'Altura que alcanza un chorro vertical']])}
${example('Tanque abierto',`El orificio está 1,25 m por debajo de la superficie. ¿Velocidad de salida?`,chain([R`v=\sqrt{2\cdot9{,}8\cdot1{,}25}\approx4{,}95\ \mathrm{m/s}`]),`${m('v\\approx4{,}95\\ \\mathrm{m/s}')}`)}
${example('Tanque presurizado',`Un tanque cerrado tiene aire a 50 kPa manométricos sobre el agua. El orificio está 2 m bajo la superficie.`,chain([R`v=\sqrt{\frac{2\cdot50\,000}{1000}+2\cdot9{,}8\cdot2}=\sqrt{100+39{,}2}\approx11{,}8\ \mathrm{m/s}`]),`${m('v\\approx11{,}8\\ \\mathrm{m/s}')}. ${simple('La presión extra “empuja” más rápido')}`)}
${lab('torricelli','Velocidad de salida de un tanque','Agregá presión manométrica si el tanque está cerrado.',fields(field('h','h (m)',1.25),field('dp','Δp sobre el agua (kPa)',0),field('d','Diámetro del orificio (cm)',2),field('rho','ρ (kg/m³)',1000))+out)}
${err('Errores típicos',ul(['Usar '+m('\\rho_m g h')+' en vez de '+m('(\\rho_m-\\rho_f)gh')+' cuando el manómetro mide una cañería con otro fluido.','Aplicar Torricelli sin verificar que el tanque sea grande ('+m('v_{superficie}\\approx0')+').','Olvidar calcular '+m('Q=Av')+' después de hallar la velocidad.']))}
${cards([['Ley','Torricelli','v = √(2gh) para tanque grande y abierto.'],['Medidor','¿Qué mide un Pitot?','La diferencia entre presión de estancamiento y estática: Δp = ½ρv².'],['Receta','Venturi en cuatro pasos','Continuidad → Δp del manómetro → Bernoulli horizontal → despejar.'],['Fórmula','Altura de un chorro vertical','h = v² / (2g)']])}
`}]});

  /* ---------------- C14 ---------------- */
  T.push({id:'C14',group:'guia',title:'Cómo elegir la fórmula',short:'Mapa de decisión y práctica rápida.',
  lead:'La mayoría de los errores no salen de hacer mal una cuenta, sino de usar una fórmula correcta en el tipo de ejercicio equivocado. Primero clasificá; después elegí.',
  sections:[
  {id:'mapa',label:'Mapa de decisión',html:`
${decide([
 ['Choque con pivote, bala que se clava, discos que se acoplan','Conservación de L (C1)',m('L_i=L_f')],
 ['Cuerpo que gira con eje fijo, polea con masa','Dinámica de rotación (C2)',m('\\sum\\tau=I\\alpha')],
 ['Eje que no pasa por el centro','Steiner (C3)',m('I_P=I_{CM}+Md^2')],
 ['Algo que rueda sin deslizar','Rodadura (C4)',m('v_{CM}=R\\omega')+' + energía de traslación y rotación'],
 ['Nada se mueve (vigas, escaleras)','Equilibrio (C5)',m('\\sum F=0,\\ \\sum\\tau=0')],
 ['Resorte que oscila','MAS (C6–C7)',m("x''+\\Omega^2x=0")+', '+m('\\Omega=\\sqrt{k/m}')],
 ['Cuerpo rígido que oscila colgado','Péndulo físico (C8)',m("I_P\\theta''=-Mgd\\,\\theta")],
 ['Fluido quieto, profundidades, manómetros','Hidrostática (C9–C10)',m('p=p_0+\\rho gh')],
 ['Algo flota, se hunde o cuelga sumergido','Arquímedes (C11)',m('E=\\rho_fgV_{sum}')],
 ['Fluido que circula, caños, tanques','Continuidad + Bernoulli (C12–C13)',m('Q=Av')+' y Bernoulli']])}
${idea('Regla mental',`<p>1) ¿Qué me piden? 2) ¿Hay choque, rotación, equilibrio, oscilación, fluido quieto o fluido en movimiento? 3) ¿Se cumplen las hipótesis (torque externo nulo, rodadura pura, ángulo chico, fluido ideal)? Recién ahí, la fórmula.</p>`)}
${warn('Problemas de varias etapas',`<p>Muchos parciales encadenan: “bala se clava (L) → la varilla sube (energía)”, o “bloque baja (energía) → choca (L)”. Separá las etapas y usá en cada una la ley que corresponde.</p>`)}
`},
  {id:'practica',label:'Práctica: ¿qué uso?',html:`
<p>Leé la situación y elegí con qué arrancarías. ${simple('No hace falta hacer cuentas')}</p>
<div class="quiz" data-lab="quiz"></div>
<p class="score" data-score></p>
`}]});
})();

<script>
/* ================= 5) Navegación, preferencias e interactivos ================= */
(function(){

  const K=window.Kit,{fmt,esc}=K;
  const TOPICS=window.TOPICS||[];

    {id:'rot',title:'Rotación y equilibrio',sub:'C1 a C5'},
    {id:'osc',title:'Oscilaciones',sub:'C6 a C8'},
    {id:'est',title:'Fluidos en reposo',sub:'C9 a C11'},
    {id:'din',title:'Fluidos en movimiento',sub:'C12 y C13'},
    {id:'guia',title:'Para cerrar',sub:'C14'}];
  const $=s=>document.querySelector(s);
  const app=$('#app'),chips=$('#chips');

  let current=-1,timers=[];

  /* ---------- Preferencias (tema y tamaño), sincronizables con la página madre ---------- */
  const setTheme=t=>{document.body.classList.toggle('light',t==='light');store.set('theme',t)};
  const setScale=s=>{document.documentElement.style.setProperty('--scale',s);store.set('scale',s)};
  const setAccent=c=>{if(!/^#[0-9a-f]{6}$/i.test(c||''))return;document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-light',shade(c));};
  const shade=hex=>{const n=parseInt(hex.slice(1),16);const f=x=>Math.max(0,Math.round(x*.62));return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(x=>x.toString(16).padStart(2,'0')).join('')};
  setTheme(store.get('theme','dark'));setScale(store.get('scale','1'));
  const prefs=$('#prefs'),prefsBtn=$('#prefsBtn');

      if(![r1,r2].every(pos)||!(h1>=0)||!(h2>=0)){outEl(root).innerHTML=bad;return}
      const a=r1*g*h1,b=r2*g*h2,pm=a+b;
      outEl(root).innerHTML=`ρ₁gh₁ = ${fmt(a,1)} Pa · ρ₂gh₂ = ${fmt(b,1)} Pa<br><b>p manométrica = ${fmt(pm,1)} Pa</b>${p0?` · <b>p absoluta = ${fmt(p0+pm,0)} Pa ≈ ${fmt((p0+pm)/101300,3)} atm</b>`:''}`})},

    float(root){const st=root.querySelector('[data-stage]');root.querySelector('output[data-for="rc"]').dataset.custom=1;
      bind(root,()=>{const rc=val(root,'rc'),rf=Number(root.querySelector('[name="rf"]').value),fr=rc/rf,sink=fr>=1;
        root.querySelector('output[data-for="rc"]').textContent=`${fmt(rc,0)}`;
        const wl=80,h=70,top=sink?192-h:wl-(1-fr)*h;
        st.innerHTML=`<path d="M60 20 V194 H420 V20" class="s-line"/><rect x="62" y="${wl}" width="356" height="112" class="${rf===800?'s-oil':rf===13600?'s-hg':'s-water'}"/><line x1="60" y1="${wl}" x2="420" y2="${wl}" class="s-thin"/>
          <rect x="200" y="${top}" width="80" height="${h}" rx="4" class="s-wood"/>${!sink?`<line x1="290" y1="${wl}" x2="290" y2="${top+h}" class="s-ok" marker-start="url(#aOk)" marker-end="url(#aOk)"/><text x="298" y="${(wl+top+h)/2+5}" class="s-tok">${fmt(fr*100,0)} %</text>`:''}`;
        outEl(root).innerHTML=sink?`<b>Se hunde</b>: ρ cuerpo ≥ ρ líquido. Aun totalmente sumergido, E &lt; P.<br><small>Para sostenerlo hace falta una fuerza extra (por ejemplo, un hilo con T = P − E).</small>`:`<b>Flota con el ${fmt(fr*100,1)} % sumergido</b> (V_sum/V = ρ_c/ρ_f = ${fmt(rc,0)}/${fmt(rf,0)}).`})},

    bernoulli(root){bind(root,()=>{const d1=val(root,'d1')/100,d2=val(root,'d2')/100,v1=val(root,'v1'),dy=val(root,'dy'),rho=1000;
      if(![d1,d2,v1].every(pos)||!Number.isFinite(dy)){outEl(root).innerHTML=bad;return}
      const v2=v1*(d1/d2)**2,Q=Math.PI*d1*d1/4*v1,dp=.5*rho*(v2*v2-v1*v1)+rho*g*dy;
      outEl(root).innerHTML=`<b>v₂ = ${fmt(v2,3)} m/s</b> · Q = ${fmt(Q*1000,3)} L/s<br><b>p₁ − p₂ = ${fmt(dp,1)} Pa</b><br><small>= ½ρ(v₂² − v₁²) ${dy?'+ ρg(y₂ − y₁) ':''}· ${dp>0?'la presión baja de 1 a 2':dp<0?'la presión sube de 1 a 2':'misma presión'}.</small>`})},

    venturi(root){bind(root,()=>{const d1=val(root,'d1')/100,d2=val(root,'d2')/100,h=val(root,'h')/100,rm=val(root,'rm'),rf=val(root,'rf');
      if(![d1,d2,h,rm,rf].every(pos)||d2>=d1||rm<=rf){outEl(root).innerHTML='<small>Revisá los datos: D₂ tiene que ser menor que D₁ y ρ del manómetro mayor que la del fluido.</small>';return}
      const dp=(rm-rf)*g*h,ratio=(d1/d2)**4,v1=Math.sqrt(2*dp/(rf*(ratio-1))),v2=v1*(d1/d2)**2,Q=Math.PI*d1*d1/4*v1;
      outEl(root).innerHTML=`Δp = (ρ_m − ρ_f)·g·h = <b>${fmt(dp,1)} Pa</b><br><b>v₁ = ${fmt(v1,3)} m/s</b> · v₂ = ${fmt(v2,3)} m/s<br><b>Q = ${fmt(Q*1000,3)} L/s</b>`})},

    torricelli(root){bind(root,()=>{const h=val(root,'h'),dp=val(root,'dp')*1000,d=val(root,'d')/100,rho=val(root,'rho');
      if(!(h>=0)||!(dp>=0)||![d,rho].every(pos)){outEl(root).innerHTML=bad;return}
      const v=Math.sqrt(2*dp/rho+2*g*h),Q=Math.PI*d*d/4*v;
      outEl(root).innerHTML=`<b>v = ${fmt(v,3)} m/s</b> · Q = ${fmt(Q*1000,3)} L/s<br><small>Un chorro vertical con esa velocidad subiría h = v²/2g = ${fmt(v*v/(2*g),2)} m${dp?' (más que el nivel del tanque, por la presión extra)':' (justo hasta el nivel del agua)'}.</small>`})},

    quiz(root){
      const Q=[
        ['Una bala se incrusta en una puerta que gira sobre sus bisagras. ¿Velocidad angular justo después?',['L_i = L_f respecto de las bisagras','Conservar la energía cinética','Conservar p lineal'],0,'Choque inelástico con pivote: las bisagras hacen fuerza externa (p no se conserva) y se pierde energía. Se conserva L respecto del eje.'],
        ['Un cilindro baja rodando sin deslizar por un plano desde una altura h. ¿Rapidez abajo?',['mgh = ½mv²','Energía con traslación + rotación y v = Rω','L_i = L_f'],1,'Rozamiento estático no disipa: mgh = ½Mv² + ½Iω² con v = Rω.'],
        ['Una viga apoyada en dos caballetes soporta una carga. ¿Reacciones?',['ΣF = 0 y Στ = 0','Στ = Iα','Bernoulli'],0,'Nada se mueve: equilibrio. Tomá momentos en un apoyo para eliminar su reacción.'],
        ['Un aro cuelga de un clavo y oscila con ángulo chico. ¿Período?',['T = 2π√(L/g)','T = 2π√(I_P/(Mgd)) con Steiner','T = 2π√(m/k)'],1,'Es un péndulo físico: I_P = MR² + MR² = 2MR², d = R.'],
        ['Un bloque cuelga de un resorte; lo bajás 3 cm y lo soltás. ¿Ecuación de movimiento?',['x = 3 cm·cos(Ωt) con Ω = √(k/m), medido desde el equilibrio','Hay que sumar mg en la ecuación','x = (v₀/Ω)·sen(Ωt)'],0,'Medido desde el equilibrio, el peso ya está incluido. Se suelta desde el extremo: coseno con A = 3 cm.'],
        ['¿Presión en el fondo de un tanque con nafta sobre agua?',['p = p₀ + ρ_agua·g·h_total','Sumar ρgh de cada capa','Bernoulli'],1,'Fluido quieto en capas: p = p₀ + ρ₁gh₁ + ρ₂gh₂.'],
        ['Un cubo de madera flota en agua. ¿Qué parte queda sumergida?',['E = P → V_sum/V = ρ_c/ρ_f','T = P − E','Siempre la mitad'],0,'Flota en equilibrio: el empuje de la parte sumergida iguala al peso.'],
        ['Agua pasa de un caño de 6 cm a uno de 3 cm. ¿Diferencia de presión?',['Sólo continuidad','Continuidad y después Bernoulli','p = p₀ + ρgh'],1,'Continuidad da v₂ = 4v₁; Bernoulli da Δp. Se necesitan las dos.'],
        ['Un tanque grande y abierto tiene un orificio 2 m bajo la superficie. ¿Velocidad de salida?',['v = √(2gh)','A₁v₁ = A₂v₂ solamente','Pitot'],0,'Torricelli: superficie y orificio a p_atm, v en la superficie ≈ 0.'],
        ['Dos discos giran sobre el mismo eje y de golpe quedan pegados. ¿ω final?',['I₁ω₁ + I₂ω₂ = (I₁ + I₂)ω','Conservar ½Iω²','Στ = Iα con τ conocido'],0,'Acople: no hay torque externo sobre el eje → se conserva L (la energía no).']];
      let score=0,answered=0;const sc=root.parentElement.querySelector('[data-score]');
      root.innerHTML=Q.map(([q,opts],i)=>`<div class="qcard" data-q="${i}"><p>${i+1}. ${q}</p><div class="qopts">${opts.map((o,j)=>`<button type="button" data-o="${j}">${o}</button>`).join('')}</div><div class="qfb"></div></div>`).join('');
      const upd=()=>sc.textContent=answered?`Llevás ${score} de ${answered} bien${answered===Q.length?(score===Q.length?' · ¡perfecto!':' · repasá los que fallaste'):''}.`:'';
      root.querySelectorAll('.qcard').forEach(card=>{const i=Number(card.dataset.q),[,,right,fb]=Q[i];
        card.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(card.classList.contains('answered'))return;card.classList.add('answered');answered++;const j=Number(b.dataset.o);
          if(j===right){score++;b.classList.add('right')}else{b.classList.add('wrong');card.querySelector(`[data-o="${right}"]`).classList.add('right')}
          card.querySelector('.qfb').innerHTML=(j===right?'✓ ':'✗ ')+fb;upd()})});
      upd()}
  };

  /* ---------- Arranque ---------- */
  const fromHash=()=>{const h=(location.hash||'').replace('#','');if(!h)return null;const [id]=h.split('-');const i=TOPICS.findIndex(t=>t.id===id);return i>=0?{i,sec:h.includes('-')?h:null}:null};
  const start=fromHash();
  if(start){go(start.i);if(start.sec)setTimeout(()=>{const el=document.getElementById(start.sec);if(el)el.scrollIntoView({block:'start'})},300)}
  else go(Number(store.get('last','-1')));
  window.addEventListener('hashchange',()=>{const s=fromHash();if(s&&s.i!==current)go(s.i)});
})();
</script>
</body>
