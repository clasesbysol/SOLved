<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Física I · Teoría del segundo parcial</title>
<!--
  SOLved · Física I · Teoría del segundo parcial (C1–C14).
  Página autocontenida: se abre dentro de summary.html (sección "Teoría · 2.º parcial").
  Estructura del archivo:
    1) estilos  2) kit de componentes (fórmulas, cajas, ejemplos, calculadoras)
    3) esquemas SVG  4) contenido de cada tema (TOPICS)  5) navegación e interactivos.
  Fórmulas en LaTeX con MathJax: \( ... \) en el texto, \[ ... \] en bloque.
-->
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{
  --bg:#07131f;--bg2:#0a1a2a;--surface:#0d2033;--surface2:#11283e;--line:#24425e;--line2:#2f5576;
  --text:#e9f4ff;--muted:#9db7cc;--accent:#38bdf8;--accent-ink:#04121d;
  --ok:#77dfa2;--warn:#ffd071;--bad:#ff9a8a;--violet:#a78bfa;
  --svg-stroke:#cfe6f7;--svg-soft:#163550;--svg-soft2:#1d4466;--svg-water:#1e5b86;--svg-water2:#2b74a6;--svg-oil:#8a6a1e;--svg-hg:#9aa7b4;--svg-wood:#a8763e;
  --radius:16px;--scale:1;
}
body.light{
  --bg:#f3f8fd;--bg2:#eaf2fa;--surface:#ffffff;--surface2:#eef5fc;--line:#c9dbec;--line2:#a9c4dd;
  --text:#132a40;--muted:#4c6780;--accent-ink:#ffffff;
  --ok:#14804a;--warn:#9a6400;--bad:#b4402c;--violet:#6d4fd6;
  --svg-stroke:#1d3a55;--svg-soft:#dcebf8;--svg-soft2:#c3dcf2;--svg-water:#8ec5ec;--svg-water2:#5aa7dc;--svg-oil:#e6c46a;--svg-hg:#b9c3cc;--svg-wood:#d9a66b;
}
body.light{--accent:var(--accent-light,#0b78b4)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:calc(16px*var(--scale))/1.62 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
p{margin:.55em 0}
h2,h3,h4{line-height:1.25}
mjx-container{color:inherit}
mjx-container[display="true"]{margin:.2em 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;gap:8px;max-width:920px;margin:0 auto;padding:9px 14px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font-size:.66rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.brand b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:0 0 auto;display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:.85rem}
.iconbtn:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:920px;margin:0 auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:750;white-space:nowrap}
.chip span{font-size:.68rem;font-weight:900;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.active span{color:inherit;opacity:.8}
.chip.done:not(.active) span:after{content:" ✓";color:var(--ok)}
.progressbar{height:3px;background:var(--line)}
.progressbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

main{max-width:920px;margin:0 auto;padding:18px 14px 90px}

/* ---------- Inicio ---------- */
.hero{position:relative;overflow:hidden;padding:24px 22px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 92% 0,color-mix(in srgb,var(--violet) 32%,transparent),transparent 55%),linear-gradient(135deg,var(--surface2),var(--surface))}
.hero small{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 8px;font-size:clamp(1.55rem,5vw,2.3rem);line-height:1.12}
.hero p{color:var(--muted);max-width:620px;margin:0}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .stats span{padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.78rem;font-weight:750}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0 4px}
.howto div{padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;color:var(--muted)}
.howto b{display:block;color:var(--text);font-size:.92rem;margin-bottom:2px}
.group{margin-top:26px}
.group>header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group>header h2{margin:0;font-size:1.15rem}
.group>header span{color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;text-align:left;padding:13px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{grid-row:1/3;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.78rem;font-weight:900;color:var(--accent)}
.tile.done .ic{background:color-mix(in srgb,var(--ok) 18%,var(--surface2));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tile b{font-size:.98rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.35}

/* ---------- Tema ---------- */
.topicHero{padding:20px 20px 16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,var(--surface2),var(--surface))}
.topicHero small{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.topicHero h1{margin:4px 0 6px;font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.15}
.topicHero p.lead{margin:0;color:var(--muted)}
.inTopic{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.inTopic a{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:.76rem;font-weight:750;color:var(--text);text-decoration:none}
.inTopic a:hover{border-color:var(--accent)}
.sec{scroll-margin-top:118px;margin-top:30px}
.sec>h2{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;font-size:1.28rem}
.sec>h2 span{font-size:.7rem;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.sec h3{margin:1.6em 0 .3em;font-size:1.06rem}
.sec ul,.sec ol{padding-left:1.25em;margin:.5em 0}
.sec li{margin:.3em 0}

/* Fórmulas: una por renglón, con nota al costado */
.eqChain{display:grid;gap:4px;margin:14px 0 18px;padding:10px 14px;border-left:4px solid var(--accent);border-radius:0 14px 14px 0;background:var(--surface2)}
.eqRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:center;gap:2px 16px;min-width:0}
.eq{min-width:0;overflow-x:auto;overflow-y:hidden}
.eq mjx-container[display="true"]{text-align:left!important}
.eqNote{color:var(--muted);font-size:.8rem;line-height:1.35;max-width:250px;text-align:right}
.eqNote:before{content:"← "}
.keyF{margin:16px 0;padding:12px 16px;border:1.5px solid color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));overflow-x:auto}
.keyF>span{display:block;font-size:.66rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.keyF mjx-container{font-size:118%!important}
.keyGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.keyGrid .keyF{margin:0}
.simple{color:color-mix(in srgb,var(--accent) 72%,var(--text));font-style:italic}
.sym{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:14px 0 18px}
.sym>div{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sym b{grid-row:1/3;min-width:38px;text-align:center}
.sym span{font-size:.88rem;line-height:1.35}
.sym em{font-style:normal;font-size:.75rem;color:var(--muted)}

/* Cajas */
.box{margin:16px 0;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.box>b{display:block;margin-bottom:2px}
.box.idea{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.box.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.box.err{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.box.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.box.method ol{counter-reset:none}
.twoCol{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:14px 0}
.twoCol>.box{margin:0}

/* Desplegables */
details.fold{margin:16px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
details.fold>summary{display:grid;gap:1px;padding:12px 46px 12px 15px;cursor:pointer;list-style:none;position:relative}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"+";position:absolute;right:13px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);color:var(--accent);font-weight:900}
details.fold[open]>summary:after{content:"–"}
details.fold>summary span{font-size:.64rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
details.fold>summary b{font-size:1rem}
details.fold .foldBody{padding:4px 15px 14px;border-top:1px solid var(--line)}
details.fold.example{border-left:4px solid var(--accent)}
details.fold.deep>summary span{color:var(--violet)}
details.fold.deep{border-left:4px solid var(--violet)}
.statement{margin:12px 0;padding:11px 13px;border-radius:12px;background:var(--surface2)}
.step{margin:12px 0}
.step h4{margin:0 0 2px;font-size:.92rem;color:var(--accent)}
.answer{margin-top:12px;padding:10px 13px;border-left:4px solid var(--ok);border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.answer b{color:var(--ok);margin-right:6px}
.eqChain .eqChain{margin:6px 0}

/* Tablas */
.tableWrap{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:.88rem}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* Figuras SVG */
figure.fig{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg2)}
figure.fig svg{display:block;width:100%;height:auto;max-height:340px}
figure.fig figcaption{margin-top:6px;color:var(--muted);font-size:.8rem;text-align:center}
.s-line{stroke:var(--svg-stroke);stroke-width:2;fill:none}
.s-thin{stroke:var(--svg-stroke);stroke-width:1.2;fill:none;opacity:.6}
.s-dash{stroke:var(--svg-stroke);stroke-width:1.5;fill:none;stroke-dasharray:6 5;opacity:.75}
.s-soft{fill:var(--svg-soft);stroke:var(--svg-stroke);stroke-width:1.5}
.s-soft2{fill:var(--svg-soft2);stroke:var(--svg-stroke);stroke-width:1.5}
.s-water{fill:var(--svg-water);opacity:.85}
.s-water2{fill:var(--svg-water2);opacity:.9}
.s-oil{fill:var(--svg-oil);opacity:.85}
.s-hg{fill:var(--svg-hg)}
.s-wood{fill:var(--svg-wood);stroke:var(--svg-stroke);stroke-width:1.5}
.s-ground{fill:none;stroke:var(--svg-stroke);stroke-width:2}
.s-hatch{stroke:var(--svg-stroke);stroke-width:1.2;opacity:.55}
.s-acc{stroke:var(--accent);stroke-width:3;fill:none}
.s-accf{fill:var(--accent)}
.s-ok{stroke:var(--ok);stroke-width:3;fill:none}
.s-okf{fill:var(--ok)}
.s-warn{stroke:var(--warn);stroke-width:3;fill:none}
.s-warnf{fill:var(--warn)}
.s-bad{stroke:var(--bad);stroke-width:3;fill:none}
.s-badf{fill:var(--bad)}
.s-vio{stroke:var(--violet);stroke-width:3;fill:none}
.s-viof{fill:var(--violet)}
.s-dot{fill:var(--svg-stroke)}
.s-t{fill:var(--text);font:600 15px Inter,"Segoe UI",system-ui,sans-serif}
.s-ts{fill:var(--muted);font:600 13px Inter,"Segoe UI",system-ui,sans-serif}
.s-tb{fill:var(--text);font:800 16px Inter,"Segoe UI",system-ui,sans-serif}
.s-ta{fill:var(--accent);font:800 15px Inter,"Segoe UI",system-ui,sans-serif}
.s-tok{fill:var(--ok);font:800 15px Inter,"Segoe UI",system-ui,sans-serif}
.s-twarn{fill:var(--warn);font:800 15px Inter,"Segoe UI",system-ui,sans-serif}
.s-tbad{fill:var(--bad);font:800 15px Inter,"Segoe UI",system-ui,sans-serif}
.s-tvio{fill:var(--violet);font:800 15px Inter,"Segoe UI",system-ui,sans-serif}

/* Interactivos */
.lab{margin:18px 0;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:18px;background:var(--surface);overflow:hidden}
.labHead{padding:12px 15px 4px}
.labHead span{font-size:.64rem;font-weight:900;letter-spacing:.13em;color:var(--accent)}
.labHead b{display:block;font-size:1rem}
.labHead p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.labBody{padding:8px 15px 15px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 10px}
.fields label{display:grid;gap:3px;font-size:.76rem;font-weight:750;color:var(--muted)}
.fields input,.fields select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}
.fields input:focus,.fields select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-color:var(--accent)}
.out{display:block;padding:10px 13px;border-radius:12px;background:var(--surface2);font-size:.92rem;line-height:1.55}
.out b{color:var(--accent)}
.out small{color:var(--muted)}
.slider{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:6px 0;font-size:.82rem;font-weight:750}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{min-width:76px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.stage{display:block;width:100%;height:auto;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.btnRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:800;font-size:.85rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:70px 1fr 62px;gap:8px;align-items:center;font-size:.8rem;font-weight:750}
.bar div{height:14px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.bar div i{display:block;height:100%;width:0}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Tarjetas de repaso */
.flipGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.flip{position:relative;min-height:150px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.flip .tag{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.flip .q{font-weight:800;line-height:1.35}
.flip .a{display:none;line-height:1.45;font-size:.92rem}
.flip small{margin-top:auto;color:var(--muted);font-size:.72rem}
.flip.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.flip.on .q{display:none}.flip.on .a{display:block}
.flip.on .tag{color:var(--ok)}

/* Mapa de decisión */
.decide{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:14px 0}
.decide>div{display:grid;gap:3px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.decide small{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.decide b{line-height:1.35}
.decide span{color:var(--accent);font-weight:800;font-size:.88rem}
.decideF{overflow-x:auto;font-size:.95rem}
/* Quiz para elegir fórmula */
.quiz{display:grid;gap:10px}
.qcard{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.qcard p{margin:0 0 8px;font-weight:700}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopts button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:.84rem;font-weight:750}
.qopts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface2))}
.qopts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface2));opacity:.85}
.qfb{display:none;margin-top:8px;font-size:.88rem;color:var(--muted)}
.qcard.answered .qfb{display:block}
.score{font-weight:800;color:var(--accent)}

/* Pie del tema */
.topicNav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px}
.topicNav button{display:grid;gap:2px;padding:13px 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.topicNav button:last-child{text-align:right}
.topicNav button small{font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topicNav button b{font-size:.95rem}
.topicNav button:hover{border-color:var(--accent)}
.topicNav button[disabled]{visibility:hidden}
.doneBtn{display:flex;justify-content:center;margin-top:22px}
.doneBtn button{padding:11px 18px;border-radius:999px;border:1px solid var(--ok);background:transparent;color:var(--ok);font-weight:850;cursor:pointer}
.doneBtn button.is-done{background:var(--ok);color:var(--accent-ink)}
.toTop{position:fixed;right:14px;bottom:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s}
.toTop.show{opacity:1;pointer-events:auto}

/* Panel de apariencia */
.prefs{position:absolute;right:14px;top:56px;z-index:50;width:min(280px,calc(100vw - 28px));padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.prefs[hidden]{display:none}
.prefs strong{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.prefs .row{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:620px){
  main{padding:14px 12px 90px}
  .eqRow{grid-template-columns:1fr}
  .eqNote{text-align:left;max-width:none}
  .eqNote:before{content:"↑ "}
  .eqChain{padding:9px 10px;margin-inline:-2px}
  .hero,.topicHero{padding:18px 15px}
  .topicNav{grid-template-columns:1fr}

<script>
/* ================= 2) Kit de componentes ================= */
(function(){
  'use strict';
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tex=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'\\lt ').replace(/>/g,'\\gt ');
  // Fórmula en bloque, en su propio renglón, con nota corta opcional al costado.
  const M=(t,note)=>`<div class="eqRow"><div class="eq">\\[${tex(t)}\\]</div>${note?`<small class="eqNote">${note}</small>`:''}</div>`;
  // Fórmula dentro del texto.
  const m=t=>`\\(${tex(t)}\\)`;
  // Cadena de pasos: cada paso es un latex o [latex, comentario].
  const chain=(...s)=>`<div class="eqChain">${s.map(x=>Array.isArray(x)?M(x[0],x[1]):M(x)).join('')}</div>`;
  // Fórmula clave (la que hay que recordar).
  const key=(t,label)=>`<div class="keyF">${label?`<span>${label}</span>`:''}\\[${tex(t)}\\]</div>`;
  const keys=list=>`<div class="keyGrid">${list.map(([t,l])=>key(t,l)).join('')}</div>`;
  // Tabla de símbolos: [latex, significado, unidad].
  const sym=rows=>`<div class="sym">${rows.map(([s,t,u])=>`<div><b>${m(s)}</b><span>${t}</span>${u?`<em>${u}</em>`:''}</div>`).join('')}</div>`;
  // Explicación simple, entre paréntesis y en cursiva.
  const simple=t=>`<span class="simple">(${t})</span>`;
  const box=(kind,title,html)=>`<div class="box ${kind}"><b>${title}</b>${html}</div>`;
  const idea=(t,h)=>box('idea','💡 '+t,h), warn=(t,h)=>box('warn','⚠ '+t,h), err=(t,h)=>box('err','✗ '+t,h), ok=(t,h)=>box('ok','✓ '+t,h);
  const two=(...b)=>`<div class="twoCol">${b.join('')}</div>`;
  const ul=items=>`<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  const ol=items=>`<ol>${items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
  // Teoría más larga, desplegable.
  const deep=(title,html)=>`<details class="fold deep"><summary><span>📖 Para leer con calma</span><b>${title}</b></summary><div class="foldBody">${html}</div></details>`;
  // Ejemplo resuelto desplegable.
  const example=(title,statement,body,answer)=>`<details class="fold example"><summary><span>Ejemplo resuelto</span><b>${title}</b></summary><div class="foldBody">${statement?`<div class="statement">${statement}</div>`:''}${body}${answer?`<div class="answer"><b>Resultado</b>${answer}</div>`:''}</div></details>`;
  const step=(title,html)=>`<div class="step"><h4>${title}</h4>${html}</div>`;
  const table=(head,rows)=>`<div class="tableWrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const fig=(svg,caption)=>`<figure class="fig">${svg}${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`;
  // Tarjetas de repaso: [etiqueta, pregunta, respuesta].
  const cards=list=>`<div class="flipGrid">${list.map(([t,q,a])=>`<button type="button" class="flip" aria-pressed="false"><span class="tag">${t}</span><span class="q">${q}</span><span class="a">${a}</span><small>Tocá para dar vuelta ↻</small></button>`).join('')}</div>`;
  // Bloque interactivo: el comportamiento se conecta por data-lab (ver LABS más abajo).
  const lab=(id,title,lead,inner='')=>`<div class="lab" data-lab="${id}"><div class="labHead"><span>PROBALO</span><b>${title}</b>${lead?`<p>${lead}</p>`:''}</div><div class="labBody">${inner}</div></div>`;
  const field=(name,label,value,extra='')=>`<label><span>${label}</span><input name="${name}" type="number" inputmode="decimal" step="any" value="${value}" ${extra}></label>`;
  const select=(name,label,opts)=>`<label><span>${label}</span><select name="${name}">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`;
  const fields=(...f)=>`<div class="fields">${f.join('')}</div>`;
  const slider=(name,label,min,max,st,val)=>`<label class="slider"><span>${label}</span><input type="range" name="${name}" min="${min}" max="${max}" step="${st}" value="${val}"><output data-for="${name}"></output></label>`;
  const out=`<output class="out" aria-live="polite"></output>`;
  const fmt=(x,d=3)=>{
    if(!Number.isFinite(x))return '—';
    const a=Math.abs(x);
    if(a!==0&&(a<1e-3||a>=1e6))return x.toExponential(2).replace('.',',');
    return x.toLocaleString('es-AR',{maximumFractionDigits:d,useGrouping:false});
  };
  window.Kit={esc,M,m,chain,key,keys,sym,simple,box,idea,warn,err,ok,two,ul,ol,deep,example,step,table,fig,cards,lab,field,select,fields,slider,out,fmt};
})();
</script>

  S.pitot=svg(480,220,'Tubo de Pitot: en la boca del tubo el fluido se frena y la presión sube',`
