<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18aeb5"><title>SOLved · Química General</title><style>:root{color-scheme:light dark}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4fbfc;color:#17363a}.loading{min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:520px;border:1px solid #cfe5e7;border-radius:18px;background:#fff;padding:24px;box-shadow:0 10px 30px rgba(15,80,86,.08)}.dot{width:12px;height:12px;border-radius:50%;background:#18aeb5;display:inline-block;margin-right:8px;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(prefers-color-scheme:dark){html,body{background:#0d1d20;color:#e8f6f7}.card{background:#12272b;border-color:#28464a}}</style></head><body><div class="loading"><div class="card"><b><span class="dot"></span>Cargando Química General</b><p>Preparando el primer tramo…</p></div></div><script>async function ungzip64(text){const raw=atob(String(text).replace(/\s+/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('DecompressionStream no disponible');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(stream).text()}(async()=>{try{const version='0.1.0';const names=['qg-payload-1.txt','qg-payload-2.txt','qg-payload-3.txt'];const parts=await Promise.all(names.map(name=>fetch(`${name}?v=${version}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(name);return r.text()})));const html=await ungzip64(parts.join(''));try{history.scrollRestoration='manual'}catch{}document.open();document.write(html);document.close()}catch(error){console.error(error);document.body.innerHTML='<div class="loading"><div class="card"><b>No se pudo abrir Química General</b><p>Actualizá el contenido de SOLved y volvé a intentar.</p></div></div>'}})();</script></body></html>
