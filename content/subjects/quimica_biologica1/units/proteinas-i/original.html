<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e74888"><title>SOLved · Química Biológica · Resumen integral</title><style>:root{--solved-hue:344}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#fff8fc;color:#382734}.loading{min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:560px;border:1px solid #efd3e0;border-radius:18px;background:#fff;padding:24px;box-shadow:0 10px 30px rgba(104,42,75,.08)}.dot{width:12px;height:12px;border-radius:50%;background:#e74888;display:inline-block;margin-right:8px;animation:pulse 1s infinite alternate}.retry{border:0;border-radius:12px;background:#e74888;color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}.error-note{font-size:.82rem;opacity:.62;overflow-wrap:anywhere}@keyframes pulse{to{opacity:.25}}</style></head><body><div class="loading"><div class="card"><b><span class="dot"></span>Cargando Química Biológica</b><p>Preparando el resumen integral de SOLved…</p></div></div><script>
const QBI_UNIT='content/subjects/quimica_biologica1/units/proteinas-i/';
const QBI_PAYLOAD_VERSION='4.0.0';
const QBI_UI_VERSION='4.1.2';
const QBI_NAMES=Array.from({length:13},(_,i)=>'qbi4-payload-'+(i+1)+'.txt');
function qbiCandidateBases(){const out=[];const add=value=>{try{const url=new URL(value,location.href).href;if(!out.includes(url))out.push(url)}catch{}};const inspect=href=>{try{const u=new URL(href);if(!/^https?:$/.test(u.protocol))return;const marker='/content/subjects/quimica_biologica1/units/proteinas-i/';const at=u.pathname.indexOf(marker);if(at>=0)add(u.origin+u.pathname.slice(0,at)+marker);const repoMark='/SOLved/';const repoAt=u.pathname.indexOf(repoMark);if(repoAt>=0)add(u.origin+u.pathname.slice(0,repoAt)+repoMark+QBI_UNIT);add(new URL(QBI_UNIT,new URL('./',u)).href);add(u.origin+'/'+QBI_UNIT)}catch{}};inspect(location.href);try{if(parent&&parent!==window)inspect(parent.location.href)}catch{}add(QBI_UNIT);return out}
async function qbiFetchBundle(){let lastError=Error('No se encontraron los archivos del resumen');for(const base of qbiCandidateBases()){for(const suffix of ['?v='+QBI_PAYLOAD_VERSION,'']){try{const responses=await Promise.all(QBI_NAMES.map(name=>fetch(base+name+suffix,{cache:'default'})));const bad=responses.findIndex(response=>!response.ok);if(bad>=0)throw Error(QBI_NAMES[bad]+' respondió '+responses[bad].status);const parts=await Promise.all(responses.map(response=>response.text()));return {encoded:parts.join(''),base}}catch(error){lastError=error}}}throw lastError}
async function qbiUngzip64(text){const raw=atob(String(text).replace(/\s+/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('Este visor no soporta DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(stream).text()}
function qbiPrepareDocument(rawHtml,base){const parsed=new DOMParser().parseFromString(rawHtml,'text/html');let baseTag=parsed.querySelector('base');if(!baseTag){baseTag=parsed.createElement('base');parsed.head.prepend(baseTag)}baseTag.href=base;const extras=[['qbi-math-render-fix.js','qbiMathRenderFix'],['qbi-guide-memory-maps.js','qbiGuideMemoryMaps'],['qbi-guide-memory-equations.js','qbiGuideMemoryEquations'],['qbi-enzimas3-integration.js','qbiEnzimas3Integration']];for(const [name,key] of extras){if(parsed.querySelector('[data-'+key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+']'))continue;const node=parsed.createElement('script');node.src=new URL(name+'?v='+QBI_UI_VERSION,base).href;node.dataset[key]='1';parsed.body.append(node)}return '<!doctype html>'+parsed.documentElement.outerHTML}
(async()=>{try{const bundle=await qbiFetchBundle();const rawHtml=await qbiUngzip64(bundle.encoded);const finalHtml=qbiPrepareDocument(rawHtml,bundle.base);document.open();document.write(finalHtml);document.close()}catch(error){console.error('QBI loader',error);const message=String(error&&error.message||error||'error desconocido');const box=document.querySelector('.card');if(box){box.innerHTML='';const title=document.createElement('b');title.textContent='No se pudo abrir el resumen';const text=document.createElement('p');text.textContent='SOLved no pudo reconstruir Química Biológica.';const button=document.createElement('button');button.className='retry';button.textContent='Reintentar';button.onclick=()=>location.reload();const detail=document.createElement('p');detail.className='error-note';detail.textContent='Detalle: '+message;box.append(title,text,button,detail)}}})();
</script></body></html>
