<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e74888"><title>SOLved · Química Biológica · Resumen integral</title><style id="solved-standard-theme">:root{--solved-hue:344}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#fff8fc;color:#382734}.loading{min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:560px;border:1px solid #efd3e0;border-radius:18px;background:#fff;padding:24px;box-shadow:0 10px 30px rgba(104,42,75,.08)}.dot{width:12px;height:12px;border-radius:50%;background:#e74888;display:inline-block;margin-right:8px;animation:pulse 1s infinite alternate}.retry{border:0;border-radius:12px;background:#e74888;color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}.error-note{font-size:.82rem;opacity:.62;overflow-wrap:anywhere}@keyframes pulse{to{opacity:.25}}</style></head><body><div class="loading"><div class="card"><b><span class="dot"></span>Cargando Química Biológica</b><p>Preparando el resumen integral de SOLved…</p></div></div><script>const SOLVED_RICH_BRIDGE=['solved-rich-selection','solved-rich-state'];void SOLVED_RICH_BRIDGE;
const QBI_UNIT='content/subjects/quimica_biologica1/units/proteinas-i/';
const QBI_PAYLOAD_VERSION='4.0.0';
const QBI_UI_VERSION='4.0.2';
const QBI_NAMES=["qbi4-payload-1.txt","qbi4-payload-2.txt","qbi4-payload-3.txt","qbi4-payload-4.txt","qbi4-payload-5.txt","qbi4-payload-6.txt","qbi4-payload-7.txt","qbi4-payload-8.txt","qbi4-payload-9.txt","qbi4-payload-10.txt","qbi4-payload-11.txt","qbi4-payload-12.txt","qbi4-payload-13.txt"];
function qbiBases(){const roots=[];const add=value=>{if(value&&!roots.includes(value))roots.push(value)};const hrefs=[];try{hrefs.push(location.href)}catch{}try{if(parent&&parent!==window)hrefs.push(parent.location.href)}catch{}for(const href of hrefs){try{const u=new URL(href);if(!/^https?:$/.test(u.protocol))continue;const dir=new URL('./',u).href;if(dir.includes('/content/subjects/quimica_biologica1/units/proteinas-i/'))add(dir);add(new URL(QBI_UNIT,dir).href);add(new URL('/SOLved/'+QBI_UNIT,u.origin).href);add(new URL('/'+QBI_UNIT,u.origin).href)}catch{}}add(QBI_UNIT);return roots}
async function qbiFetchParts(){let lastError=null;for(const base of qbiBases()){for(const suffix of ['?v='+QBI_PAYLOAD_VERSION,'']){try{const first=await fetch(base+QBI_NAMES[0]+suffix,{cache:'default'});if(!first.ok)throw Error(first.status+' '+base);const parts=new Array(QBI_NAMES.length);parts[0]=await first.text();const rest=await Promise.all(QBI_NAMES.slice(1).map(async name=>{const response=await fetch(base+name+suffix,{cache:'default'});if(!response.ok)throw Error(response.status+' '+name);return response.text()}));for(let i=1;i<parts.length;i++)parts[i]=rest[i-1];return {text:parts.join(''),base}}catch(error){lastError=error}}}throw lastError||Error('No se encontraron los archivos del resumen')}
async function ungzip64(text){const raw=atob(String(text).replace(/\s+/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('Este visor no soporta la descompresión del resumen');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(stream).text()}
function qbiInject(html,base){const scripts=[['qbi-math-render-fix.js','data-qbi-math-render-fix="1"'],['qbi-guide-memory-maps.js','data-qbi-guide-memory-maps="1"']].filter(([,marker])=>!html.includes(marker)).map(([name,marker])=>'<script src="'+base+name+'?v='+QBI_UI_VERSION+'" '+marker+'><\/script>').join('');return scripts?html.replace(/<\/body>/i,scripts+'</body>'):html}
(async()=>{try{const payload=await qbiFetchParts();const rawHtml=await ungzip64(payload.text);const html=qbiInject(rawHtml,payload.base);document.open();document.write(html);document.close()}catch(error){console.error('QBI loader',error);const message=String(error&&error.message||error||'error desconocido');document.body.innerHTML='<div class="loading"><div class="card"><b>No se pudo abrir el resumen</b><p>SOLved no pudo reconstruir Química Biológica. Tocá reintentar; el cargador ya prueba automáticamente las rutas de la app y de la versión instalada.</p><button class="retry" onclick="location.reload()">Reintentar</button><p class="error-note">Detalle: '+message.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</p></div></div>'}})();</script></body></html>
